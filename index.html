<!DOCTYPE html>
<html lang="ru">
<head>

<title>Миссия Каллисто — научная экспедиция</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#020611;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font:inherit}
#app{position:fixed;inset:0;background:radial-gradient(circle at 50% 20%,#102243 0,#040914 45%,#01040a 100%)}
#canvas{position:absolute;inset:0;z-index:1;touch-action:none}
#hud{position:absolute;inset:0;z-index:5;pointer-events:none}
.pointer{pointer-events:auto}
.topbar{position:absolute;left:12px;right:12px;top:10px;display:flex;align-items:center;gap:8px}
.titlebox{flex:1;background:rgba(4,10,22,.72);backdrop-filter:blur(14px);border:1px solid rgba(90,210,255,.25);border-radius:15px;padding:10px 12px;box-shadow:0 8px 30px #0008}
.title{font-size:12px;letter-spacing:1px;color:#7dd3fc;font-weight:800}.subtitle{font-size:10px;color:#a9b7c9;margin-top:2px}
.score{background:rgba(4,10,22,.78);border:1px solid rgba(250,204,21,.35);border-radius:15px;padding:9px 12px;font-size:12px;font-weight:800;color:#fde68a;white-space:nowrap}
.bottom{position:absolute;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
background:linear-gradient(180deg,rgba(2,6,16,0),rgba(2,6,16,.88) 18%,rgba(2,6,16,.97));pointer-events:none}
.sheet{max-width:560px;margin:0 auto;background:rgba(7,13,28,.90);backdrop-filter:blur(18px);border:1px solid rgba(96,210,255,.28);border-radius:22px;padding:13px;box-shadow:0 -8px 38px #000b;pointer-events:auto;max-height:46dvh;overflow:auto}
.grab{width:36px;height:4px;border-radius:3px;background:#3a506a;margin:0 auto 9px}
.sheet h2{font-size:16px;color:#dff7ff}.sheet p{font-size:11px;line-height:1.45;color:#aebdce;margin-top:5px}
.btnrow{display:flex;gap:7px;margin-top:10px}.btn{flex:1;border:0;border-radius:12px;padding:12px 10px;background:linear-gradient(135deg,#0891b2,#2563eb);color:white;font-weight:800;font-size:12px;box-shadow:0 5px 15px #0ea5e944}.btn.alt{background:rgba(255,255,255,.07);border:1px solid #334155;box-shadow:none}.btn.good{background:linear-gradient(135deg,#059669,#0f766e)}.btn.warn{background:linear-gradient(135deg,#d97706,#b45309)}.btn:active{transform:scale(.98)}
.pills{display:flex;gap:7px;overflow:auto;padding:8px 0 2px}.pill{flex:0 0 auto;border:1px solid #29435a;background:rgba(255,255,255,.04);border-radius:999px;padding:7px 10px;font-size:10px;color:#c5d4e5}.pill.active{border-color:#38bdf8;background:#0ea5e933;color:#e0f2fe}
.route{display:flex;align-items:center;gap:6px;overflow:auto;padding:7px 0}.node{flex:0 0 auto;background:#0b2036;border:1px solid #1e5a7a;border-radius:9px;padding:6px 9px;font-size:10px;color:#dff7ff}.arrow{color:#5eead4;font-size:12px}
.feedback{font-size:11px;line-height:1.35;margin-top:7px;padding:9px;border-radius:10px;background:rgba(255,255,255,.035);border:1px solid #1f3448}
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.choice{border:1px solid #243a50;background:rgba(255,255,255,.035);border-radius:11px;padding:9px;cursor:pointer}.choice.active{border-color:#38bdf8;background:#082c3b}.choice b{font-size:11px}.choice span{display:block;color:#8fa3b8;font-size:9px;margin-top:3px;line-height:1.3}
.full{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(2,6,15,.84);backdrop-filter:blur(10px)}
.modal{width:min(520px,100%);background:rgba(7,13,28,.95);border:1px solid #24506a;border-radius:22px;padding:17px;box-shadow:0 20px 50px #000b}.modal h3{font-size:18px;color:#7dd3fc}.modal p{font-size:12px;line-height:1.5;color:#c1cfdf;margin-top:8px}.modal .science{margin-top:10px;padding:10px;border-radius:12px;background:#0a1727;border:1px solid #20384f}.science b{color:#f7d774}.science span{display:block;color:#b6c7d8;font-size:11px;margin-top:4px;line-height:1.45}
#markerLayer{position:absolute;inset:0;z-index:4;pointer-events:none}.marker{position:absolute;transform:translate(-50%,-50%);display:none;pointer-events:auto}.marker button{animation:pulse 1.8s infinite; border:1px solid #59d4ff;background:rgba(4,10,20,.92);color:#e9fbff;padding:7px 9px;border-radius:12px;box-shadow:0 0 18px #38bdf855;font-size:10px;white-space:nowrap}.marker button small{display:inline-block;color:#6ee7b7;margin-left:4px;font-size:9px}.marker.selected button{background:#67e8f9;color:#05202a;border-color:#cffafe;font-weight:900}
#toast{position:absolute;left:50%;top:72px;transform:translateX(-50%) translateY(-12px);opacity:0;z-index:20;background:rgba(3,10,20,.92);border:1px solid #2b566f;border-radius:999px;padding:8px 12px;font-size:11px;pointer-events:none;transition:.25s;white-space:nowrap}
#reticle{position:absolute;left:50%;top:47%;width:70px;height:70px;transform:translate(-50%,-50%);border:1px dashed #67e8f9;opacity:.25;border-radius:50%;pointer-events:none}
.hudline{display:flex;justify-content:space-between;gap:7px;margin-top:6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:#7dd3fc}.hudline span:last-child{color:#e2e8f0}
.controlrow{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px;margin-top:9px}.control{height:48px;border-radius:13px;border:1px solid #2c5166;background:#091728;color:#def7ff;font-weight:900;font-size:12px}.control.thrust{background:linear-gradient(135deg,#b45309,#ea580c);border-color:#fb923c}.control:active{transform:scale(.97)}
.ephem-table{width:100%;border-collapse:collapse;margin-top:9px;font-size:10px}.ephem-table th,.ephem-table td{padding:7px 5px;border-bottom:1px solid #1d3244;text-align:left}.ephem-table th{color:#7dd3fc}.ephem-table td{color:#c6d2df}
@keyframes pulse{0%,100%{box-shadow:0 0 12px #38bdf844,0 0 0 0 #38bdf822}50%{box-shadow:0 0 22px #38bdf8aa,0 0 0 7px #38bdf800}}.hidden{display:none!important}
@media (min-width:700px){.sheet{max-width:650px;max-height:40dvh}.title{font-size:14px}.sheet h2{font-size:18px}.sheet p{font-size:12px}.btn{font-size:13px}}
</style>
</head>
<body>
<div id="app"><div id="canvas"></div><div id="markerLayer"></div><div id="reticle"></div>
<div id="hud">
  <div class="topbar"><div class="titlebox"><div class="title">МИССИЯ КАЛЛИСТО</div><div id="stageTitle" class="subtitle">1 / 5 · Выбор научной точки</div></div><div class="score">НАУКА <span id="score">0</span></div></div>
  <div id="bottom" class="bottom"></div>
</div>
<div id="toast"></div>
<div id="modalLayer" class="full"><div class="modal" id="modalContent"></div></div>
</div>
<script>
const APP={
 stage:1, score:0, zone:null, route:['Земля'], rocket:'heavy', asteroidData:0,
 dragging:false, landed:false,
 zones:{
  valhalla:{id:'valhalla',name:'Вальхалла',lat:16,lng:-55,pts:140,tag:'ДРЕВНИЙ МНОГОКОЛЬЦЕВОЙ БАССЕЙН',desc:'Огромная многокольцевая ударная структура. Центральная светлая область связана с материалом, богатым льдом.',task:'Исследовать следы гигантского удара и сравнить яркую центральную область с окружающим рельефом.',equipment:'Радар + камера помогут изучить структуру и рельеф; бур добавит локальный образец.'},
  asgard:{id:'asgard',name:'Асгард',lat:30,lng:-142,pts:120,tag:'МНОГОКОЛЬЦЕВАЯ СТРУКТУРА',desc:'Одна из крупнейших структур Каллисто: светлая центральная зона окружена разорванными кольцами и уступами.',task:'Изучить деформацию ледяной коры вокруг древнего бассейна.',equipment:'Спектрометр + камера полезны для сравнения светлой области и окружающего материала; радар — для структуры.'},
  burr:{id:'burr',name:'Бурр',lat:39,lng:-145,pts:155,tag:'МОЛОДОЙ ЛУЧИСТЫЙ КРАТЕР',desc:'Сравнительно молодой яркий кратер на северной части Асгарда. Хорошая точка для сравнения свежего удара с древним рельефом.',task:'Изучить молодые выбросы и контрастировать их с сильно разрушенной поверхностью.',equipment:'Камера и спектрометр — лучший учебный набор для ярких выбросов и их состава.'},
  doh:{id:'doh',name:'Дох',lat:27,lng:-142,pts:170,tag:'КУПОЛЬНЫЙ КРАТЕР',desc:'Кратер в светлых центральных равнинах Асгарда. Его форма помогает обсуждать поведение ледяной коры после удара.',task:'Проверить форму центрального поднятия и характер окружающей поверхности.',equipment:'Камера + радар позволят сравнить форму купола и скрытую структуру под поверхностью.'}
 }
};
let scene,camera,renderer,controls,clock;
let globe,starfield,sun,ship,lander,ground,targetPad;
let markerEls={}; let zoneVectors={}; let routePlanets={}; let trajectory=null; let trajectoryPoints=[];
let asteroids=[]; let landing={alt:4200,vy:-34,x:0,vx:0,time:0};
let ctrl={left:false,right:false,thrust:false};
const TEX={callisto:'procedural'};

function $(id){return document.getElementById(id)}
function toast(s){const e=$('toast');e.textContent=s;e.style.opacity=1;e.style.transform='translateX(-50%) translateY(0)';clearTimeout(window._tt);window._tt=setTimeout(()=>{e.style.opacity=0;e.style.transform='translateX(-50%) translateY(-12px)'},1800)}
function setStageTitle(t){$('stageTitle').textContent=t}
function addScore(n,reason){APP.score+=n;$('score').textContent=APP.score;toast((n>0?'+':'')+n+' науч. баллов · '+reason)}

// ---------- Procedural Callisto texture (self-contained; no generic Moon texture) ----------
function makeCallistoTexture(){
 const c=document.createElement('canvas');c.width=1024;c.height=512;const ctx=c.getContext('2d');
 const g=ctx.createLinearGradient(0,0,0,512);g.addColorStop(0,'#566066');g.addColorStop(.38,'#574f4b');g.addColorStop(.7,'#463f3d');g.addColorStop(1,'#2b3034');ctx.fillStyle=g;ctx.fillRect(0,0,1024,512);
 // mottled terrain
 for(let i=0;i<2600;i++){const x=Math.random()*1024,y=Math.random()*512,r=Math.random()*8+1;const v=45+Math.random()*70;ctx.fillStyle=`rgba(${v+25},${v+18},${v+15},${Math.random()*.22})`;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
 // dark/bright impact patches
 function crater(x,y,r,bright=false){const rg=ctx.createRadialGradient(x-r*.12,y-r*.15,0,x,y,r);if(bright){rg.addColorStop(0,'rgba(240,240,226,.92)');rg.addColorStop(.48,'rgba(175,178,170,.55)');rg.addColorStop(.8,'rgba(48,43,43,.2)');rg.addColorStop(1,'rgba(0,0,0,0)')}else{rg.addColorStop(0,'rgba(15,18,21,.65)');rg.addColorStop(.55,'rgba(45,40,39,.35)');rg.addColorStop(1,'rgba(0,0,0,0)')}ctx.fillStyle=rg;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
 for(let i=0;i<180;i++)crater(Math.random()*1024,Math.random()*512,Math.random()*10+2,Math.random()<.08);
 // Valhalla and Asgard mapped as stylized multi-ring structures
 function basin(x,y,r,core){for(let k=4;k>=1;k--){ctx.strokeStyle=`rgba(205,210,200,${.22-.035*k})`;ctx.lineWidth=4+2*k;ctx.beginPath();ctx.arc(x,y,r*(.25+.17*k),0,Math.PI*2);ctx.stroke()}ctx.fillStyle='rgba(230,231,220,.42)';ctx.beginPath();ctx.arc(x,y,r*core,0,Math.PI*2);ctx.fill()}
 // map projection approximate: lon -> x, lat -> y
 function xy(lat,lng){return [((lng+180)/360)*1024,(90-lat)/180*512]}
 let [vx,vy]=xy(16,-55);basin(vx,vy,90,.32); let [ax,ay]=xy(30,-142);basin(ax,ay,55,.30);
 for(let i=0;i<14;i++){let a=Math.random()*Math.PI*2;let rr=65+Math.random()*60;crater(vx+Math.cos(a)*rr,vy+Math.sin(a)*rr,3+Math.random()*7,false)}
 for(let i=0;i<8;i++){let a=Math.random()*Math.PI*2;let rr=35+Math.random()*35;crater(ax+Math.cos(a)*rr,ay+Math.sin(a)*rr,3+Math.random()*5,true)}
 return new THREE.CanvasTexture(c);
}
const callistoTex=makeCallistoTexture();

function init(){
 scene=new THREE.Scene();clock=new THREE.Clock();
 camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.05,2000);
 renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;$('canvas').appendChild(renderer.domElement);
 scene.add(new THREE.AmbientLight(0x9fb9d0,1.5));const dl=new THREE.DirectionalLight(0xffffff,2.2);dl.position.set(10,8,10);scene.add(dl);
 makeStars();window.addEventListener('resize',resize); setupStage1(); animate();
}
function makeStars(){const geo=new THREE.BufferGeometry(),a=[];for(let i=0;i<3000;i++)a.push((Math.random()-.5)*1500,(Math.random()-.5)*1500,(Math.random()-.5)*1500);geo.setAttribute('position',new THREE.Float32BufferAttribute(a,3));starfield=new THREE.Points(geo,new THREE.PointsMaterial({color:0x9fd9ff,size:1.1,sizeAttenuation:true}));scene.add(starfield)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
function clearScene(){[...scene.children].forEach(o=>{if(o!==starfield && o.type!=='AmbientLight' && o.type!=='DirectionalLight')scene.remove(o)});asteroids=[];routePlanets={};trajectory=null;trajectoryPoints=[];controls?.dispose();controls=null;markerEls={};$('markerLayer').innerHTML='';}


// ---------- Stage 1: 3D Callisto / site selection ----------
function setupStage1(){
 APP.stage=1; setStageTitle('1 / 5 · Вращай Каллисто и выбирай научную точку'); clearScene();
 globe=new THREE.Mesh(new THREE.SphereGeometry(5.2,96,64),new THREE.MeshStandardMaterial({map:callistoTex,roughness:.92,metalness:.02}));scene.add(globe);
 camera.position.set(0,0,13);
 controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enablePan=false;controls.enableDamping=true;controls.dampingFactor=.08;controls.rotateSpeed=.58;controls.minDistance=7.5;controls.maxDistance=18;controls.target.set(0,0,0);
 Object.values(APP.zones).forEach(z=>{zoneVectors[z.id]=latLngVector(z.lat,z.lng,5.25);const el=document.createElement('div');el.className='marker';el.innerHTML=`<button>${z.name}<small>• +${z.pts}</small></button>`;el.onclick=e=>{e.stopPropagation();inspectZone(z.id)};$('markerLayer').appendChild(el);markerEls[z.id]=el});
 $('reticle').style.display='none';
 $('bottom').innerHTML=`<div class="sheet"><div class="grab"></div><h2>🪐 Карта Каллисто</h2><p><b>Сначала смотри, потом решай.</b> Крути Каллисто пальцем, приближай поверхность. Нажми на светящийся маркер, чтобы узнать, что именно можно исследовать в этой области.</p><div id="siteHint" class="feedback">Пока точка не выбрана.</div><div class="btnrow"><button class="btn alt" onclick="openEphem()">📚 Эфемерида</button><button id="zoneNext" class="btn" disabled onclick="confirmZone()">Выбрать точку</button></div></div>`;
}
function latLngVector(lat,lng,r){const phi=(90-lat)*Math.PI/180,theta=(lng+180)*Math.PI/180;return new THREE.Vector3(-(r*Math.sin(phi)*Math.cos(theta)),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(theta))}
function updateMarkers(){if(APP.stage!==1||!globe)return;Object.values(APP.zones).forEach(z=>{const v=zoneVectors[z.id].clone().applyMatrix4(globe.matrixWorld);const view=camera.position.clone().sub(v).normalize();const normal=v.clone().normalize();const dot=view.dot(normal);const p=v.clone().project(camera);const el=markerEls[z.id];if(dot>.02&&p.z<1){el.style.display='block';el.style.left=((p.x*.5+.5)*innerWidth)+'px';el.style.top=((-p.y*.5+.5)*innerHeight)+'px';el.classList.toggle('selected',APP.zone?.id===z.id)}else el.style.display='none'})}
function inspectZone(id){
 APP.zone=APP.zones[id]; const v=zoneVectors[id].clone().normalize(); const target=v.clone().multiplyScalar(0);
 const cam=v.clone().multiplyScalar(9.1); gsap.to(camera.position,{x:cam.x,y:cam.y,z:cam.z,duration:1.05,ease:'power3.inOut',onUpdate:()=>{camera.lookAt(target)}});
 $('siteHint').innerHTML=`<b>${APP.zone.name}</b> · ${APP.zone.tag}<br>${APP.zone.desc}<br><span style="color:#67e8b6">Научная задача:</span> ${APP.zone.task}<br><span style="color:#f7d56b">Награда: +${APP.zone.pts} научных баллов</span><br><span style="color:#93c5fd">Совет по оборудованию:</span> ${APP.zone.equipment}`;
 $('zoneNext').disabled=false; toast('Камера приближает выбранную область');
}
function confirmZone(){if(!APP.zone)return;addScore(20,'за выбор научной цели');setupStage2()}

// ---------- Ephemeris lesson ----------
function openEphem(){
 $('modalLayer').style.display='flex';$('modalContent').innerHTML=`<h3>Эфемерида: «где и когда находится тело»</h3><p><b>Эфемерида</b> — это рассчитанное представление положения и скорости небесного тела в зависимости от времени. То есть вместо «планета где-то здесь» мы задаём: <b>в такой-то момент времени она находится вот здесь и движется с такой-то скоростью</b>.</p><div class="science"><b>Почему это важно для миссии?</b><span>Планеты не стоят на месте. Пока аппарат летит к Юпитеру, Земля, Венера, Марс и сам Юпитер продолжают двигаться. Поэтому навигатору нужен не только рисунок орбит, но и время: момент старта, положение цели и время импульса.</span></div><div class="science"><b>Учебная модель</b><span>Зелёная траектория ниже не является реальным навигационным решением. Игра использует упрощённые орбиты, чтобы показать саму идею: <b>траектория = пространство + время</b>.</span></div><table class="ephem-table"><tr><th>В момент t</th><th>Положение</th><th>Скорость</th></tr><tr><td>Земля</td><td>x, y, z</td><td>v(t)</td></tr><tr><td>Юпитер</td><td>x, y, z</td><td>v(t)</td></tr><tr><td>Каллисто</td><td>x, y, z</td><td>v(t)</td></tr></table><div class="btnrow"><button class="btn" onclick="closeModal()">Понятно</button></div>`;
}
function closeModal(){$('modalLayer').style.display='none'}

// ---------- Stage 2: payload / spacecraft builder ----------
APP.equipment=APP.equipment||{};
APP.equipmentCatalog=[
 {id:'drill',name:'Бур',mass:18,power:55,icon:'⛏️',desc:'Берём керн и изучаем состав приповерхностного слоя.',zones:['valhalla','doh']},
 {id:'spectro',name:'Спектрометр',mass:12,power:80,icon:'🔬',desc:'Ищем минералогические и ледяные признаки по спектру.',zones:['asgard','burr']},
 {id:'radar',name:'Радар',mass:22,power:105,icon:'📡',desc:'Исследуем структуру под поверхностью.',zones:['valhalla','asgard','doh']},
 {id:'camera',name:'Камера',mass:8,power:35,icon:'📷',desc:'Строим детальную панораму рельефа и следим за посадкой.',zones:['valhalla','burr','doh']},
 {id:'rtg',name:'РИТЭГ',mass:28,power:-210,icon:'⚡',desc:'Источник электричества для длительной работы приборов.',zones:['valhalla','asgard','burr','doh']}
];
function setupStage2(){
 APP.stage=2; setStageTitle('2 / 5 · Собери научный аппарат'); clearScene();
 camera.position.set(0,1.2,11);camera.lookAt(0,1,0);
 APP.equipment={};
 ship=createScienceLander();scene.add(ship);

function createLander(){const g=new THREE.Group();const base=new THREE.Mesh(new THREE.CylinderGeometry(.8,1.05,.8,10),new THREE.MeshStandardMaterial({color:0xd97706,metalness:.6,roughness:.3}));g.add(base);const cap=new THREE.Mesh(new THREE.SphereGeometry(.58,18,12,0,Math.PI*2,0,Math.PI*.7),new THREE.MeshStandardMaterial({color:0xf1f5f9}));cap.position.y=.55;g.add(cap);for(let i=0;i<4;i++){const a=i*Math.PI/2,leg=new THREE.Mesh(new THREE.CylinderGeometry(.045,.06,1.2),new THREE.MeshStandardMaterial({color:0x94a3b8}));leg.position.set(Math.cos(a)*.9,-.6,Math.sin(a)*.9);leg.rotation.z=Math.cos(a)*.3;leg.rotation.x=-Math.sin(a)*.3;g.add(leg)}const flame=new THREE.Mesh(new THREE.ConeGeometry(.18,.8,10),new THREE.MeshBasicMaterial({color:0xf97316,transparent:true,opacity:.8}));flame.position.y=-.8;flame.visible=false;g.add(flame);g.userData.flame=flame;return g}
function landingUpdate(dt){if(!lander)return;const grav=-.68,thrust=ctrl.thrust?2.55:0,side=(ctrl.left?-1:0)+(ctrl.right?1:0);landing.vy+=(grav+thrust)*dt*9;landing.vx+=side*1.8*dt;landing.alt+=landing.vy*dt*6;landing.x+=landing.vx*dt*4;landing.alt=Math.max(0,landing.alt);lander.position.y=landing.alt/300;lander.position.x=landing.x/21;lander.position.z=1.7+landing.alt/420;lander.rotation.z=-landing.vx*.08;lander.userData.flame.visible=ctrl.thrust;$('alt').textContent=Math.round(landing.alt)+' м';$('vvert').textContent=(landing.vy<0?'−':'')+Math.abs(Math.round(landing.vy))+' м/с';$('off').textContent=Math.abs(Math.round(landing.x))+' м';$('vvert').style.color=landing.vy<-16?'#f87171':'#6ee7b7';if(landing.alt<=0){lander.position.y=0;if(Math.abs(landing.vy)>17||Math.abs(landing.x)>40)finish(false);else finish(true)}}
function finish(ok){if(ok){APP.landed=true;addScore(APP.zone.pts,'за посадку в выбранной научной зоне');showFinish(true)}else showFinish(false)}
function showFinish(ok){$('modalLayer').style.display='flex';$('modalContent').innerHTML=ok?`<h3>🎉 Мягкая посадка!</h3><p>Ты села именно туда, куда выбрала в начале: <b>${APP.zone.name}</b>.</p><div class="science"><b>Что исследуем</b><span>${APP.zone.task}</span></div><div class="science"><b>Научный отчёт</b><span>Точка: ${APP.zone.name}<br>Приборы: ${Object.values(APP.equipment).map(x=>x.name).join(', ')||'не выбраны'}<br>Маршрут: ${APP.route.join(' → ')}<br>Итог: ${APP.score} баллов</span></div><div class="btnrow"><button class="btn good" onclick="closeModal();setupStage1()">Новая экспедиция</button></div>`:`<h3>⚠️ Жёсткое касание</h3><p>Нужно уменьшить вертикальную скорость и удержать аппарат ближе к центру выбранной зоны.</p><div class="science"><b>Попробуй ещё</b><span>Тяга тормозит падение, а лево/право помогает совместить аппарат с кольцом.</span></div><div class="btnrow"><button class="btn warn" onclick="closeModal();setupLanding()">Ещё одна попытка</button></div>`}

// ---------- Main loop ----------
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(controls)controls.update();
 if(APP.stage===1){if(globe)globe.rotation.y+=dt*.018;updateMarkers()}
 if(APP.stage===4 && routePlanets && Object.keys(routePlanets).length){for(const p of Object.values(routePlanets)){p.angle+=dt*(.22*(20/p.r));p.mesh.position.set(Math.cos(p.angle)*p.r,0,Math.sin(p.angle)*p.r)}updateTrajectory();}
 if(APP.stage===4 && ship && asteroids.length){window.beltT=(window.beltT||0)+dt;let progress=Math.min(100,window.beltT*12);if($('beltProgress'))$('beltProgress').textContent=Math.floor(progress)+'%';asteroids.forEach(a=>{a.position.z+=(a.userData.speed||12)*dt;if(a.position.z>30){a.position.z=-80-Math.random()*70;a.position.x=(Math.random()-.5)*24;a.position.y=(Math.random()-.5)*13}if(a.position.distanceTo(ship.position)<1.55 && !window._beltFail){window._beltFail=true;addScore(-15,'столкновение');$('modalLayer').style.display='flex';$('modalContent').innerHTML=`<h3>☄️ Столкновение</h3><p>Аппарат задел астероид. Для мастер-класса даём второй шанс.</p><div class="btnrow"><button class="btn warn" onclick="window._beltFail=false;closeModal();setupBeltMini()">Повторить</button></div>`}});if(progress>=100){setupStage5()}}
 if(APP.stage===5 && lander)landingUpdate(dt);
 if(window.orbitT!==undefined && APP.stage===5 && ship && !lander){window.orbitT+=dt*.55;const r=8.4;ship.position.set(Math.cos(window.orbitT)*r,0,Math.sin(window.orbitT)*r);ship.rotation.y=-window.orbitT;}
 renderer.render(scene,camera)}

window.openEphem=openEphem;window.closeModal=closeModal;window.inspectZone=inspectZone;window.confirmZone=confirmZone;window.attachEquipment=attachEquipment;window.confirmEquipment=confirmEquipment;window.setupStage1=setupStage1;window.setupStage2=setupStage2;window.setupStage3=setupStage3;window.setupStage4=setupStage4;window.setupStage5=setupStage5;window.openRocketCalc=openRocketCalc;window.pickRocket=pickRocket;window.addNode=addNode;window.resetRoute=resetRoute;window.checkRoute=checkRoute;window.scanAsteroid=scanAsteroid;window.toggleAutoPilot=toggleAutoPilot;window.beginDeorbit=beginDeorbit;window.setupLanding=setupLanding;

init();
window.openEphem=openEphem;window.closeModal=closeModal;window.inspectZone=inspectZone;window.confirmZone=confirmZone;window.addNode=addNode;window.resetRoute=resetRoute;window.checkRoute=checkRoute;window.setupStage2=setupStage2;window.setupStage4=setupStage4;window.setupStage5=setupStage5;window.beginDeorbit=beginDeorbit;window.setupLanding=setupLanding;window.restartLanding=restartLanding;window.pickRocket=pickRocket;window.showRocketHint=showRocketHint;window.toggleAutoPilot=toggleAutoPilot;
</script>
