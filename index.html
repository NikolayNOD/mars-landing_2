<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Посадка на Каллисто</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: #090d16; 
            color: #f3f4f6; 
            padding: 16px; 
            margin: 0; 
            user-select: none;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card { 
            background: #111827; 
            border-radius: 20px; 
            padding: 20px; 
            width: 100%;
            max-width: 380px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); 
            border: 1px solid #1f2937;
            transition: transform 0.1s;
        }

        .shake {
            animation: shakeAnim 0.4s ease-in-out;
        }
        @keyframes shakeAnim {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-8px, 5px); }
            40% { transform: translate(8px, -5px); }
            60% { transform: translate(-5px, 3px); }
            80% { transform: translate(5px, -3px); }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .lives-box { font-size: 16px; letter-spacing: 2px; }

        h2 { color: #ffffff; margin: 0; font-size: 18px; font-weight: 700; }

        .param-group { 
            margin-bottom: 14px; 
            background: #1f2937; 
            padding: 14px; 
            border-radius: 12px; 
        }
        label { display: flex; justify-content: space-between; font-size: 13px; color: #9ca3af; margin-bottom: 8px; }
        .val { color: #38bdf8; font-weight: 700; font-family: monospace; }
        
        input[type=range] { 
            width: 100%; 
            accent-color: #38bdf8; 
            height: 6px;
            border-radius: 3px;
            background: #374151;
        }

        .engines-select { display: flex; gap: 8px; margin-top: 4px; }
        .engine-opt {
            flex: 1;
            padding: 10px;
            background: #374151;
            border: 1px solid transparent;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .engine-opt.selected { background: #0284c7; border-color: #38bdf8; }

        #sim-screen { display: none; text-align: center; }
        
        #canvas-container { 
            position: relative; 
            width: 100%; 
            height: 280px; 
            background: #030712; 
            border-radius: 14px; 
            overflow: hidden; 
            border: 1px solid #1f2937;
        }
        canvas { width: 100%; height: 100%; }
        
        .dash { 
            position: absolute; 
            top: 10px; 
            left: 10px; 
            text-align: left; 
            font-family: ui-monospace, monospace; 
            font-size: 12px; 
            color: #e5e7eb; 
            background: rgba(17, 24, 39, 0.9); 
            padding: 8px 12px; 
            border-radius: 8px; 
            border: 1px solid #374151;
            line-height: 1.5; 
        }

        .hint-box { 
            position: absolute; 
            top: 10px; 
            right: 10px; 
            font-size: 11px; 
            font-weight: 700; 
            background: rgba(17, 24, 39, 0.9); 
            padding: 6px 10px; 
            border-radius: 8px; 
            border: 1px solid #374151;
            max-width: 140px;
            text-align: right;
        }

        .thrust-controls { display: flex; gap: 6px; margin-top: 12px; }
        .t-btn {
            flex: 1;
            padding: 14px 4px;
            background: #374151;
            border: 2px solid transparent;
            border-radius: 10px;
            color: white;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }
        .t-btn.off.active { background: #4b5563; border-color: #9ca3af; }
        .t-btn.mid.active { background: #d97706; border-color: #f59e0b; }
        .t-btn.max.active { background: #dc2626; border-color: #ef4444; }

        #result-screen { display: none; text-align: center; padding: 10px 0; }
        .res-title { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
        .success { color: #22c55e; }
        .warning { color: #f59e0b; }
        .crash { color: #ef4444; }

        .advice-box {
            background: #1f2937;
            border-left: 4px solid #38bdf8;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #d1d5db;
            text-align: left;
            margin: 12px 0;
            line-height: 1.4;
        }

        .achievement-box {
            background: linear-gradient(135deg, #1e1b4b, #311042);
            border: 2px solid #f59e0b;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            color: #fef08a;
            text-align: center;
            margin: 12px 0;
            line-height: 1.4;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
        }
        .achievement-title {
            font-size: 15px;
            font-weight: 800;
            color: #fbbf24;
            margin-bottom: 4px;
        }
        
        .btn-action { 
            width: 100%; 
            padding: 14px; 
            background: #0284c7; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-weight: 700; 
            font-size: 15px; 
            margin-top: 10px; 
            cursor: pointer; 
        }
    </style>
</head>
<body>

<div class="card" id="main-card">
    <div class="top-bar">
        <h2>🪐 Посадка на Каллисто</h2>
        <div class="lives-box" id="lives-display">❤️❤️❤️</div>
    </div>

    <!-- 1. Настройка параметров -->
    <div id="setup-screen">
        <div class="param-group">
            <label>Количество двигателей:</label>
            <div class="engines-select">
                <div class="engine-opt" onclick="selectEngines(1, this)">1 Двиг.</div>
                <div class="engine-opt selected" onclick="selectEngines(2, this)">2 Двиг.</div>
                <div class="engine-opt" onclick="selectEngines(3, this)">3 Двиг.</div>
            </div>
        </div>

        <div class="param-group">
            <label>Запас топлива: <span class="val" id="fuel-val">60 %</span></label>
            <input type="range" id="fuel-input" min="30" max="100" value="60" oninput="document.getElementById('fuel-val').innerText = this.value + ' %'">
            <div style="font-size: 11px; color: #6b7280; margin-top: 6px;">💡 Больше топлива даёт больше времени на маневры</div>
        </div>

        <button class="btn-action" onclick="startFlight()">🚀 НАЧАТЬ СПУСК</button>
    </div>

    <!-- 2. Симулятор падения -->
    <div id="sim-screen">
        <div id="canvas-container">
            <div class="dash">
                Высота: <span id="d-alt" style="color:#38bdf8">1000</span> м<br>
                Скорость: <b id="d-vel">0.0</b> м/с<br>
                Топливо: <span id="d-fuel" style="color:#22c55e">100</span>%
            </div>
            
            <div id="hint" class="hint-box" style="color:#f59e0b;">💡 Выбирай режим тяги!</div>
            
            <canvas id="canvas"></canvas>
        </div>
        
        <div class="thrust-controls">
            <button class="t-btn off active" onclick="setThrust(0)">🛑 ВЫКЛ</button>
            <button class="t-btn mid" onclick="setThrust(0.5)">⚡ 50%</button>
            <button class="t-btn max" onclick="setThrust(1.0)">🔥 100%</button>
        </div>
    </div>

    <!-- 3. Итог -->
    <div id="result-screen">
        <div id="res-status" class="res-title"></div>
        <div id="res-desc" style="font-size: 14px; color: #9ca3af;"></div>
        
        <!-- Блок достижений -->
        <div id="achievement-container" class="achievement-box" style="display: none;"></div>

        <!-- Окно с умным советом -->
        <div id="advice-container" class="advice-box" style="display: none;"></div>

        <button id="res-btn" class="btn-action" onclick="nextAttempt()">🔄 СЛЕДУЮЩАЯ ПОПЫТКА</button>
    </div>
</div>

<script>
    let lives = 3;
    let successfulLandings = 0; 
    let livesLostInRun = 0;      
    let numEngines = 2;
    let fuelCap = 60, currentFuel = 100;
    let alt = 1000, vel = 15, thrustLevel = 0; 
    let particles = [];
    let loop;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playBeep(freq, type, duration) {
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    function triggerShake() {
        const card = document.getElementById('main-card');
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
    }

    function selectEngines(count, elem) {
        numEngines = count;
        document.querySelectorAll('.engine-opt').forEach(el => el.classList.remove('selected'));
        elem.classList.add('selected');
    }

    function updateLivesUI() {
        let h = "";
        for (let i = 0; i < 3; i++) {
            h += i < lives ? "❤️" : "🖤";
        }
        document.getElementById('lives-display').innerText = h;
    }

    function startFlight() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        fuelCap = parseInt(document.getElementById('fuel-input').value);
        currentFuel = fuelCap;
        
        vel = 15;
        alt = 1000;
        thrustLevel = 0;
        particles = [];
        updateThrustUI();

        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('sim-screen').style.display = 'block';

        const canvas = document.getElementById('canvas');
        canvas.width = canvas.parentElement.offsetWidth;
        canvas.height = 280;

        loop = setInterval(updatePhysics, 1000/30);
    }

    function setThrust(level) {
        if (currentFuel <= 0 && level > 0) return;
        
        thrustLevel = level;
        updateThrustUI();
        if (navigator.vibrate) navigator.vibrate(25);
        
        if (thrustLevel > 0) {
            playBeep(120 + thrustLevel * 80, 'sawtooth', 0.1);
        }
    }

    function updateThrustUI() {
        const btns = document.querySelectorAll('.t-btn');
        btns.forEach(b => b.classList.remove('active'));
        if (thrustLevel === 0) btns[0].classList.add('active');
        else if (thrustLevel === 0.5) btns[1].classList.add('active');
        else if (thrustLevel === 1.0) btns[2].classList.add('active');
    }

    function updatePhysics() {
        if (thrustLevel > 0 && currentFuel > 0) {
            currentFuel -= (numEngines * thrustLevel * 0.32);
            if (currentFuel <= 0) {
                currentFuel = 0;
                setThrust(0);
            }
        }

        let massFactor = 0.18 + (currentFuel * 0.001); 
        let thrustPower = (numEngines * thrustLevel * 0.38); 

        vel += (massFactor - thrustPower);
        if (vel < -3) vel = -3;

        alt -= vel * 0.35;

        document.getElementById('d-alt').innerText = Math.max(0, Math.round(alt));
        
        const velElem = document.getElementById('d-vel');
        velElem.innerText = vel.toFixed(1);
        
        if (vel <= 4.0) velElem.style.color = "#22c55e";
        else if (vel <= 9.0) velElem.style.color = "#f59e0b";
        else velElem.style.color = "#ef4444";
        
        document.getElementById('d-fuel').innerText = Math.round(currentFuel);

        const hint = document.getElementById('hint');
        if (currentFuel <= 0) {
            hint.innerText = "⚠️ Топливо кончилось!";
            hint.style.color = "#ef4444";
        } else if (vel <= 4.0) {
            hint.innerText = "🌟 Отличная скорость!";
            hint.style.color = "#22c55e";
        } else if (vel <= 9.0) {
            hint.innerText = "⚠️ Скорость высоковата!";
            hint.style.color = "#f59e0b";
        } else {
            hint.innerText = "🔴 СНИЖАЙ СКОРОСТЬ!";
            hint.style.color = "#ef4444";
        }

        draw();

        if (alt >= 2000) {
            clearInterval(loop);
            showResult("space");
        }

        if (alt <= 0) {
            clearInterval(loop);
            if (vel <= 4.0) showResult("perfect");
            else if (vel <= 9.0) showResult("hard");
            else showResult("crash");
        }
    }

    function draw() {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;

        ctx.clearRect(0, 0, w, h);

        ctx.fillStyle = '#374151';
        ctx.fillRect(0, h - 20, w, 20);

        let y = h - 20 - (alt * (h - 80) / 1000) - 20;
        if (y < 20) y = 20;

        if (thrustLevel > 0 && currentFuel > 0) {
            for(let i = 0; i < numEngines * 2; i++) {
                particles.push({
                    x: w/2 + (Math.random() * 20 - 10),
                    y: y + 18,
                    vx: (Math.random() - 0.5) * 2,
                    vy: Math.random() * 3 + 2,
                    life: 1,
                    color: Math.random() > 0.3 ? '#f97316' : '#ef4444'
                });
            }
        }

        if (alt < 150 && thrustLevel > 0) {
            particles.push({
                x: w/2 + (Math.random() * 60 - 30),
                y: h - 20,
                vx: (Math.random() - 0.5) * 6,
                vy: -Math.random() * 2,
                life: 0.8,
                color: '#6b7280'
            });
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 2 + (1 - p.life) * 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;

            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.05;

            if (p.life <= 0) particles.splice(i, 1);
        }

        ctx.fillStyle = '#9ca3af';
        ctx.fillRect(w/2 - 14, y, 28, 16);
        
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(w/2 - 6, y + 3, 12, 5);

        ctx.strokeStyle = '#6b7280';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(w/2 - 14, y + 16); ctx.lineTo(w/2 - 20, y + 22);
        ctx.moveTo(w/2 + 14, y + 16); ctx.lineTo(w/2 + 20, y + 22);
        ctx.stroke();
    }

    function showResult(type) {
        document.getElementById('sim-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        const status = document.getElementById('res-status');
        const desc = document.getElementById('res-desc');
        const advice = document.getElementById('advice-container');
        const achievement = document.getElementById('achievement-container');
        const resBtn = document.getElementById('res-btn');

        advice.style.display = "none";
        achievement.style.display = "none";

        if (type === "perfect" || type === "hard") {
            successfulLandings++;
            playBeep(600, 'sine', 0.3);

            if (type === "perfect") {
                status.innerText = "🌟 ИДЕАЛЬНО!";
                status.className = "res-title success";
                desc.innerText = `Скорость касания: ${vel.toFixed(1)} м/с. Безупречное выполнение!`;
            } else {
                status.innerText = "⚠️ ЖЁСТКАЯ ПОСАДКА";
                status.className = "res-title warning";
                desc.innerText = `Скорость: ${vel.toFixed(1)} м/с. Корабль цел, но посадка жестковата.`;
            }

            // --- ПРОВЕРКА ДОСТИЖЕНИЙ ---
            
            // 1. Три успешные посадки подряд без потерь
            if (successfulLandings >= 3 && livesLostInRun === 0) {
                achievement.style.display = "block";
                achievement.innerHTML = `
                    <div class="achievement-title">🏆 ДОСТИЖЕНИЕ: АБСОЛЮТНЫЙ РЕКОРД</div>
                    Три безупречные посадки подряд без единой аварии! Полный контроль над ситуацией и высший пилотаж! 🚀
                `;
            } 
            // 2. Две успешные посадки с 1 потерей жизни
            else if (successfulLandings >= 2 && livesLostInRun === 1) {
                achievement.style.display = "block";
                achievement.innerHTML = `
                    <div class="achievement-title">🎖️ ДОСТИЖЕНИЕ: РАБОТА НАД ОШИБКАМИ</div>
                    Одна неудача тебя не остановила. Ты сделал правильные выводы и посадил корабль дважды подряд! 💪
                `;
            }
            // 3. Посадка после двух потерь (на последней жизни)
            else if (livesLostInRun === 2) {
                achievement.style.display = "block";
                achievement.innerHTML = `
                    <div class="achievement-title">🔥 ДОСТИЖЕНИЕ: ВЫДЕРЖКА И РАСЧЁТ</div>
                    Оставалась всего одна попытка и никакого права на ошибку, но ты справился! Холодный расчёт и полная концентрация! ⚡
                `;
            }

            resBtn.innerText = "🔄 Посадить ещё раз";

        } else {
            // Крушение или космос
            lives--;
            livesLostInRun++;
            updateLivesUI();
            playBeep(90, 'square', 0.4);
            triggerShake();

            if (lives > 0) {
                status.innerText = type === "space" ? "🌌 УЛЕТЕЛ В КОСМОС!" : "💥 ВЗРЫВ ПРИ УДАРЕ!";
                status.className = "res-title crash";
                desc.innerText = `Скорость касания: ${vel.toFixed(1)} м/с. Потеряна 1 жизнь!`;

                advice.style.display = "block";
                if (type === "space") {
                    advice.innerHTML = "💡 <b>Совет:</b> Тяга 100% горела слишком долго. Вовремя выключай двигатели!";
                } else if (currentFuel <= 0) {
                    advice.innerHTML = "💡 <b>Совет:</b> Закончилось топливо! Увеличь бак или используй режим 50%!";
                } else {
                    advice.innerHTML = "💡 <b>Совет:</b> Включай 100% тягу чуть раньше — примерно на 350 метрах!";
                }

                resBtn.innerText = "🔄 Попробовать снова";
            } else {
                status.innerText = "💀 ИГРА ОКОНЧЕНА";
                status.className = "res-title crash";
                desc.innerText = "Все 3 жизни потрачены. Попробуй сначала!";
                
                advice.style.display = "block";
                advice.innerHTML = "💡 <b>Подсказка:</b> Возьми 2 двигателя, заправь 70% топлива и включи 100% тяги на 350 м!";

                resBtn.innerText = "🚀 НАЧАТЬ ЗАНОВО";
            }
        }
    }

    function nextAttempt() {
        if (lives <= 0) {
            lives = 3;
            successfulLandings = 0;
            livesLostInRun = 0;
            updateLivesUI();
        }
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('setup-screen').style.display = 'block';
    }

    updateLivesUI();
</script>

</body>
</html>
