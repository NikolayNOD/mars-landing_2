<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каллисто: Инженерный вызов</title>
<style>
    /* Визуальный стиль «Sci-Fi Terminal» */
    body { 
        background-color: #0b0c10; /* Темная космическая тема */
        color: #00f3ff; /* Бирюзовый для систем */
        font-family: 'Courier New', Courier, monospace; /* Шрифты в стиле консолей */
        padding: 20px; 
    }
    .container { 
        border: 2px solid #00f3ff; 
        box-shadow: 0 0 15px #00f3ff; 
        padding: 20px; 
        max-width: 600px; 
        margin: auto; 
    }
    h1, h3 { text-align: center; text-transform: uppercase; }
    
    /* Неоновые акценты */
    .warning { color: #ffaa00; } /* Оранжевый для предупреждений */
    .success { color: #39ff14; } /* Кислотно-зеленый для успешных расчетов */
    
    /* Живые графики */
    .bar-container { 
        background: #1f2833; 
        height: 25px; 
        border: 1px solid #00f3ff; 
        margin-bottom: 20px; 
        position: relative;
    }
    .bar { 
        height: 100%; 
        width: 0%; 
        background: #00f3ff; 
        transition: width 0.3s ease-in-out, background-color 0.3s; 
    }
    .bar.energy-ok { background: #39ff14; }
    
    /* Красная тревога и пульсация */
    .bar.overload { 
        background: red; 
        animation: pulse 1s infinite; 
    }
    @keyframes pulse { 
        0% { opacity: 1; } 
        50% { opacity: 0.3; } 
        100% { opacity: 1; } 
    }
    
    .btn { 
        background: #1f2833; 
        color: #00f3ff; 
        border: 1px solid #00f3ff; 
        padding: 10px 15px; 
        cursor: pointer; 
        margin: 5px; 
        font-family: 'Courier New', Courier, monospace;
        font-weight: bold;
        transition: 0.2s;
    }
    .btn:hover { background: #00f3ff; color: #0b0c10; box-shadow: 0 0 10px #00f3ff; }
    .btn-reset { border-color: #ffaa00; color: #ffaa00; }
    .btn-reset:hover { background: #ffaa00; color: #0b0c10; box-shadow: 0 0 10px #ffaa00; }
    
    #ai-console { 
        border-left: 4px solid #00f3ff; 
        padding: 10px; 
        margin: 20px 0; 
        background: rgba(0, 243, 255, 0.05);
        min-height: 40px;
    }
    .inventory { display: flex; flex-wrap: wrap; justify-content: center; margin-top: 15px; }
</style>
</head>
<body>

<div class="container">
    <h1>Каллисто: Инженерный вызов</h1>
    
    <div id="ai-console">
        <strong>АЛЬФА:</strong> Добро пожаловать, инженер. Ожидаю сборку модулей аппарата.
    </div>

    <h3>Модуль 2: Конструктор аппарата</h3>
    
    <div>Масса аппарата: <span id="mass-text" class="success">0</span> / 60 кг</div>
    <div class="bar-container">
        <div id="mass-bar" class="bar"></div>
    </div>

    <div>Энергобаланс (Генерация/Потребление): <span id="energy-text" class="success">0</span></div>
    <div class="bar-container">
        <div id="energy-bar" class="bar energy-ok"></div>
    </div>

    <h3 style="margin-top: 30px;">Палитра приборов:</h3>
    <div class="inventory">
        <button class="btn" onclick="addComponent('Камера', 5, -2)">Камера (5кг, -2 эн.)</button>
        <button class="btn" onclick="addComponent('Глубокий бур', 20, -10)">Глубокий бур (20кг, -10 эн.)</button>
        <button class="btn" onclick="addComponent('РИТЭГ', 15, 15)">РИТЭГ (15кг, +15 эн.)</button>
        <button class="btn btn-reset" onclick="resetShip()">Сброс сборки</button>
    </div>
</div>

<script>
    let currentMass = 0;
    let currentEnergy = 0;
    const maxMass = 60;

    function addComponent(name, mass, energy) {
        currentMass += mass;
        currentEnergy += energy;
        updateInterface();
    }

    function resetShip() {
        currentMass = 0;
        currentEnergy = 0;
        updateInterface();
    }

    function updateInterface() {
        // Обновление текста
        document.getElementById('mass-text').innerText = currentMass;
        document.getElementById('energy-text').innerText = currentEnergy;

        const aiConsole = document.getElementById('ai-console');
        const massBar = document.getElementById('mass-bar');
        const energyBar = document.getElementById('energy-bar');

        // Логика Массы
        let massPercent = (currentMass / maxMass) * 100;
        massBar.style.width = Math.min(massPercent, 100) + '%';

        if (currentMass > maxMass) {
            massBar.classList.add('overload');
            document.getElementById('mass-text').className = 'warning';
            // Саркастичный комментарий ИИ при превышении веса
            aiConsole.innerHTML = '<strong class="warning">АЛЬФА:</strong> <span class="warning">Шеф, с таким весом мы даже с орбиты Земли не улетим. Срочно сбрасываем балласт!</span>';
        } else {
            massBar.classList.remove('overload');
            document.getElementById('mass-text').className = 'success';
            aiConsole.innerHTML = '<strong>АЛЬФА:</strong> Установка прошла успешно. Системы в норме.';
        }

        // Логика Энергии
        if (currentEnergy < 0) {
            // Если батарея разряжается быстрее, чем генерируют РИТЭГи
            energyBar.style.width = '100%';
            energyBar.classList.remove('energy-ok');
            energyBar.classList.add('overload');
            document.getElementById('energy-text').className = 'warning';
        } else {
            energyBar.style.width = Math.min((currentEnergy / 30) * 100, 100) + '%';
            energyBar.classList.remove('overload');
            energyBar.classList.add('energy-ok');
            document.getElementById('energy-text').className = 'success';
        }
    }
</script>

</body>
</html>
