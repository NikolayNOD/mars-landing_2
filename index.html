<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Экспедиция на Каллисто</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: #090d16; 
            color: #f3f4f6; 
            padding: 16px; 
            margin: 0; 
            user-select: none;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card { 
            background: #111827; 
            border-radius: 20px; 
            padding: 20px; 
            width: 100%;
            max-width: 400px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); 
            border: 1px solid #1f2937;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .attempt-box { font-size: 13px; font-weight: 700; color: #38bdf8; }
        h2 { color: #ffffff; margin: 0; font-size: 17px; font-weight: 700; }
        .step-title { font-size: 13px; color: #9ca3af; margin-bottom: 12px; font-weight: 600; }

        .rocket-select { display: flex; gap: 8px; margin-bottom: 14px; }
        .rocket-card {
            flex: 1;
            background: #1f2937;
            border: 2px solid #374151;
            border-radius: 12px;
            padding: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .rocket-card.selected { border-color: #38bdf8; background: #0f2942; }
        .rocket-card canvas { width: 100%; height: 80px; display: block; margin: 0 auto 6px; }
        .rocket-name { font-size: 11px; font-weight: 700; color: #fff; }
        .rocket-class { font-size: 10px; color: #9ca3af; }

        .param-group { 
            margin-bottom: 12px; 
            background: #1f2937; 
            padding: 12px; 
            border-radius: 12px; 
        }
        label { display: flex; justify-content: space-between; font-size: 12px; color: #9ca3af; margin-bottom: 6px; }
        
        select {
            width: 100%;
            background: #374151;
            color: #fff;
            border: 1px solid #4b5563;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
        }

        #stage-canvas-container {
            position: relative;
            width: 100%;
            height: 260px;
            background: #030712;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #1f2937;
            margin-bottom: 12px;
        }
        canvas { width: 100%; height: 100%; display: block; }

        .hud-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            font-family: monospace;
            font-size: 11px;
            color: #38bdf8;
            background: rgba(17, 24, 39, 0.85);
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #374151;
        }

        .thrust-controls { display: flex; gap: 6px; margin-top: 10px; }
        .t-btn {
            flex: 1;
            padding: 12px 4px;
            background: #374151;
            border: 2px solid transparent;
            border-radius: 8px;
            color: white;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
        }
        .t-btn.off.active { background: #4b5563; border-color: #9ca3af; }
        .t-btn.mid.active { background: #d97706; border-color: #f59e0b; }
        .t-btn.max.active { background: #dc2626; border-color: #ef4444; }

        .btn-action { 
            width: 100%; 
            padding: 14px; 
            background: #0284c7; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-weight: 700; 
            font-size: 14px; 
            cursor: pointer; 
        }

        .achievement-box {
            background: linear-gradient(135deg, #1e1b4b, #311042);
            border: 2px solid #f59e0b;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            color: #fef08a;
            text-align: center;
            margin: 12px 0;
            line-height: 1.4;
        }
        .achievement-title { font-size: 15px; font-weight: 800; color: #fbbf24; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="card" id="main-card">
    <div class="top-bar">
        <h2>🚀 Миссия «Каллисто»</h2>
        <div class="attempt-box" id="attempt-display">Попытка: 1 / 3</div>
    </div>

    <!-- ЭКРАН 1: Настройка ракеты и даты -->
    <div id="screen-setup">
        <div class="step-title">Шаг 1: Выбор ракеты-носителя (РФ)</div>
        <div class="rocket-select">
            <div class="rocket-card" onclick="selectRocket('light', this)">
                <canvas id="rc-light"></canvas>
                <div class="rocket-name">Ангара-1.2</div>
                <div class="rocket-class">Лёгкая</div>
            </div>
            <div class="rocket-card selected" onclick="selectRocket('medium', this)">
                <canvas id="rc-medium"></canvas>
                <div class="rocket-name">Союз-2.1б</div>
                <div class="rocket-class">Средняя</div>
            </div>
            <div class="rocket-card" onclick="selectRocket('heavy', this)">
                <canvas id="rc-heavy"></canvas>
                <div class="rocket-name">Ангара-А5</div>
                <div class="rocket-class">Тяжёлая</div>
            </div>
        </div>

        <div class="step-title">Шаг 2: Окно старта (гравитационный манёвр)</div>
        <div class="param-group">
            <label>Дата запуска с Земли:</label>
            <select id="launch-date">
                <option value="optimal">15 Октября — Идеальное окно (Юпитер рядом)</option>
                <option value="suboptimal">20 Ноября — Допустимое окно (+15% расхода)</option>
                <option value="bad">05 Января — Неоптимальное окно (+40% расхода)</option>
            </select>
        </div>

        <button class="btn-action" onclick="startLaunchStage()">🌍 СТАРТ С ЗЕМЛИ</button>
    </div>

    <!-- ЭКРАН 2: Анимация взлета и перелета -->
    <div id="screen-animation" style="display: none;">
        <div class="step-title" id="anim-title">Этап 1: Вывод на орбиту</div>
        <div id="stage-canvas-container">
            <div class="hud-overlay" id="hud-text">Высота: 0 км</div>
            <canvas id="anim-canvas"></canvas>
        </div>
        <button class="btn-action" id="anim-next-btn" style="display: none;" onclick="goNextAnimStage()">ДАЛЕЕ</button>
    </div>

    <!-- ЭКРАН 3: Симулятор посадки -->
    <div id="screen-landing" style="display: none;">
        <div class="step-title">Этап 3: Мягкая посадка на Каллисто</div>
        <div id="stage-canvas-container">
            <div class="hud-overlay" id="landing-hud">
                Высота: 1000 м<br>Скорость: 15.0 м/с<br>Топливо: 100%
            </div>
            <canvas id="landing-canvas"></canvas>
        </div>
        <div class="thrust-controls">
            <button class="t-btn off active" onclick="setThrust(0)">🛑 ВЫКЛ</button>
            <button class="t-btn mid" onclick="setThrust(0.5)">⚡ 50%</button>
            <button class="t-btn max" onclick="setThrust(1.0)">🔥 100%</button>
        </div>
    </div>

    <!-- ЭКРАН 4: Итог попытки / Финал -->
    <div id="screen-result" style="display: none; text-align: center;">
        <h3 id="res-title" style="font-size: 20px; margin: 10px 0 6px;"></h3>
        <p id="res-desc" style="font-size: 13px; color: #9ca3af; margin-bottom: 12px;"></p>

        <div id="achievement-container" class="achievement-box" style="display: none;"></div>

        <button id="res-btn" class="btn-action" onclick="nextAttempt()"></button>
    </div>
</div>

<script>
    let currentAttempt = 1;
    let successfulLandings = 0;
    let selectedRocket = 'medium';
    let fuelCap = 100, currentFuel = 100;
    
    // Переменные симуляции посадки
    let alt = 1000, vel = 15, thrustLevel = 0;
    let landingLoop;

    // Инициализация превью ракет
    window.onload = () => {
        drawRocketPreview('rc-light', 'light');
        drawRocketPreview('rc-medium', 'medium');
        drawRocketPreview('rc-heavy', 'heavy');
    };

    function selectRocket(type, elem) {
        selectedRocket = type;
        document.querySelectorAll('.rocket-card').forEach(el => el.classList.remove('selected'));
        elem.classList.add('selected');
    }

    function drawRocketPreview(id, type) {
        const cvs = document.getElementById(id);
        cvs.width = cvs.parentElement.offsetWidth;
        cvs.height = 80;
        const ctx = cvs.getContext('2d');
        const cx = cvs.width / 2;

        ctx.fillStyle = '#d1d5db';
        if (type === 'light') {
            ctx.fillRect(cx - 5, 20, 10, 45);
            ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.moveTo(cx-5,20); ctx.lineTo(cx,10); ctx.lineTo(cx+5,20); ctx.fill();
        } else if (type === 'medium') {
            ctx.fillRect(cx - 6, 18, 12, 48);
            ctx.fillRect(cx - 11, 35, 4, 30); ctx.fillRect(cx + 7, 35, 4, 30);
            ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.moveTo(cx-6,18); ctx.lineTo(cx,8); ctx.lineTo(cx+6,18); ctx.fill();
        } else {
            ctx.fillRect(cx - 8, 15, 16, 52);
            ctx.fillRect(cx - 15, 28, 6, 38); ctx.fillRect(cx + 9, 28, 6, 38);
            ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.moveTo(cx-8,15); ctx.lineTo(cx,5); ctx.lineTo(cx+8,15); ctx.fill();
        }
    }

    // Этап 1: Взлет с Земли
    let animStep = 0;
    function startLaunchStage() {
        document.getElementById('screen-setup').style.display = 'none';
        document.getElementById('screen-animation').style.display = 'block';
        document.getElementById('anim-next-btn').style.display = 'none';
        document.getElementById('anim-title').innerText = 'Этап 1: Вывод на опорную орбиту';

        // Расчет стартового бака
        let baseFuel = selectedRocket === 'light' ? 65 : (selectedRocket === 'medium' ? 80 : 100);
        const dateVal = document.getElementById('launch-date').value;
        if (dateVal === 'suboptimal') baseFuel -= 15;
        if (dateVal === 'bad') baseFuel -= 35;
        fuelCap = Math.max(30, baseFuel);

        let progress = 0;
        const cvs = document.getElementById('anim-canvas');
        cvs.width = cvs.parentElement.offsetWidth; cvs.height = 260;
        const ctx = cvs.getContext('2d');

        let launchInterval = setInterval(() => {
            progress += 2;
            ctx.clearRect(0,0,cvs.width,cvs.height);
            
            // Земля и небо
            ctx.fillStyle = progress < 50 ? '#1e3a8a' : '#030712';
            ctx.fillRect(0,0,cvs.width,cvs.height);

            // Ракета
            let ry = cvs.height - (progress * 2.2);
            ctx.fillStyle = '#f3f4f6';
            ctx.fillRect(cvs.width/2 - 6, ry, 12, 35);
            
            // Пламя
            ctx.fillStyle = '#f97316';
            ctx.beginPath(); ctx.arc(cvs.width/2, ry + 38, 6 + Math.random()*4, 0, Math.PI*2); ctx.fill();

            document.getElementById('hud-text').innerText = `Высота: ${progress * 4} км\nСкорость: ${(progress * 0.1).toFixed(1)} км/с`;

            if (progress >= 100) {
                clearInterval(launchInterval);
                document.getElementById('hud-text').innerText = 'Орбита достигнута!\nГотовность к перелёту.';
                document.getElementById('anim-next-btn').style.display = 'block';
                animStep = 1;
            }
        }, 50);
    }

    // Этап 2: Перелет и Гравитационный манёвр
    function goNextAnimStage() {
        if (animStep === 1) {
            document.getElementById('anim-next-btn').style.display = 'none';
            document.getElementById('anim-title').innerText = 'Этап 2: Гравитационный манёвр у Юпитера';
            
            let angle = 0;
            const cvs = document.getElementById('anim-canvas');
            const ctx = cvs.getContext('2d');

            let cruiseInterval = setInterval(() => {
                angle += 0.05;
                ctx.clearRect(0,0,cvs.width,cvs.height);

                // Юпитер
                ctx.fillStyle = '#d97706';
                ctx.beginPath(); ctx.arc(cvs.width/2, cvs.height/2, 35, 0, Math.PI*2); ctx.fill();

                // Траектория корабля
                let rx = cvs.width/2 + Math.cos(angle) * 75;
                let ry = cvs.height/2 + Math.sin(angle) * 45;

                ctx.fillStyle = '#38bdf8';
                ctx.beginPath(); ctx.arc(rx, ry, 4, 0, Math.PI*2); ctx.fill();

                document.getElementById('hud-text').innerText = `Ускорение в поле тяготения...\nТопливный бак: ${fuelCap}%`;

                if (angle >= Math.PI * 1.2) {
                    clearInterval(cruiseInterval);
                    document.getElementById('anim-next-btn').innerText = 'ПЕРЕЙТИ К ПОСАДКЕ';
                    document.getElementById('anim-next-btn').style.display = 'block';
                    animStep = 2;
                }
            }, 50);
        } else {
            startLandingStage();
        }
    }

    // Этап 3: Посадка на Каллисто
    function startLandingStage() {
        document.getElementById('screen-animation').style.display = 'none';
        document.getElementById('screen-landing').style.display = 'block';

        currentFuel = fuelCap;
        alt = 1000; vel = 15; thrustLevel = 0;
        
        const cvs = document.getElementById('landing-canvas');
        cvs.width = cvs.parentElement.offsetWidth; cvs.height = 260;

        landingLoop = setInterval(updateLandingPhysics, 1000/30);
    }

    function setThrust(level) {
        if (currentFuel <= 0 && level > 0) return;
        thrustLevel = level;
        const btns = document.querySelectorAll('.t-btn');
        btns.forEach(b => b.classList.remove('active'));
        if (thrustLevel === 0) btns[0].classList.add('active');
        else if (thrustLevel === 0.5) btns[1].classList.add('active');
        else if (thrustLevel === 1.0) btns[2].classList.add('active');
    }

    function updateLandingPhysics() {
        if (thrustLevel > 0 && currentFuel > 0) {
            currentFuel -= (thrustLevel * 0.35);
            if (currentFuel <= 0) { currentFuel = 0; setThrust(0); }
        }

        let gravity = 0.18 + (currentFuel * 0.0008);
        let thrust = thrustLevel * 0.72;

        vel += (gravity - thrust);
        if (vel < -3) vel = -3;
        alt -= vel * 0.35;

        document.getElementById('landing-hud').innerHTML = 
            `Высота: ${Math.max(0, Math.round(alt))} м<br>` +
            `Скорость: ${vel.toFixed(1)} м/с<br>` +
            `Топливо: ${Math.round(currentFuel)}%`;

        drawLandingCanvas();

        if (alt <= 0) {
            clearInterval(landingLoop);
            finishAttempt(vel <= 4.0);
        }
    }

    function drawLandingCanvas() {
        const cvs = document.getElementById('landing-canvas');
        const ctx = cvs.getContext('2d');
        const w = cvs.width, h = cvs.height;

        ctx.clearRect(0, 0, w, h);
        // Поверхность Каллисто
        ctx.fillStyle = '#374151'; ctx.fillRect(0, h - 20, w, 20);

        let y = h - 20 - (alt * (h - 60) / 1000) - 15;
        if (y < 15) y = 15;

        // Корабль
        ctx.fillStyle = '#9ca3af'; ctx.fillRect(w/2 - 10, y, 20, 14);
        if (thrustLevel > 0 && currentFuel > 0) {
            ctx.fillStyle = '#f97316';
            ctx.fillRect(w/2 - 4, y + 14, 8, 8 + Math.random()*6);
        }
    }

    function finishAttempt(isSuccess) {
        document.getElementById('screen-landing').style.display = 'none';
        document.getElementById('screen-result').style.display = 'block';

        const title = document.getElementById('res-title');
        const desc = document.getElementById('res-desc');
        const achievement = document.getElementById('achievement-container');
        const resBtn = document.getElementById('res-btn');

        achievement.style.display = 'none';

        if (isSuccess) {
            successfulLandings++;
            title.innerText = '🌟 МЯГКАЯ ПОСАДКА!';
            title.style.color = '#22c55e';
            desc.innerText = `Скорость касания: ${vel.toFixed(1)} м/с. Модуль успешно приземлился!`;
        } else {
            title.innerText = '💥 КРАХ МИССИИ!';
            title.style.color = '#ef4444';
            desc.innerText = `Скорость касания: ${vel.toFixed(1)} м/с. Модуль разбился о поверхность.`;
        }

        if (currentAttempt >= 3) {
            achievement.style.display = 'block';
            if (successfulLandings === 3) {
                achievement.innerHTML = `<div class="achievement-title">🏆 МАСТЕР КОСМОНАВТИКИ</div>3 из 3 успешных посадок! Высший пилотаж!`;
            } else if (successfulLandings === 2) {
                achievement.innerHTML = `<div class="achievement-title">🎖️ ОПЫТНЫЙ ПИЛОТ</div>2 из 3 успешных посадок. Отличный результат!`;
            } else if (successfulLandings === 1) {
                achievement.innerHTML = `<div class="achievement-title">🚀 НАЧИНАЮЩИЙ ИСПЫТАТЕЛЬ</div>1 успешная посадка. Есть куда расти!`;
            } else {
                achievement.innerHTML = `<div class="achievement-title">💀 ИГРА ОКОНЧЕНА</div>Все 3 попытки провалены. Попробуйте выбрать тяжёлую ракету и точное окно!`;
            }
            resBtn.innerText = '🔄 НАЧАТЬ ИГРУ ЗАНОВО';
        } else {
            resBtn.innerText = '➡️ СЛЕДУЮЩАЯ ПОПЫТКА';
        }
    }

    function nextAttempt() {
        if (currentAttempt >= 3) {
            currentAttempt = 1;
            successfulLandings = 0;
        } else {
            currentAttempt++;
        }
        document.getElementById('attempt-display').innerText = `Попытка: ${currentAttempt} / 3`;
        document.getElementById('screen-result').style.display = 'none';
        document.getElementById('screen-setup').style.display = 'block';
    }
</script>

</body>
</html>
