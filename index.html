<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Центр Баллистики: Расчёт Миссии Каллисто</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #020617; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; }

        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

        .hud-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 16px;
        }
        .interactive { pointer-events: auto; }

        .glass-panel {
            background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.25); border-radius: 16px;
            padding: 16px; width: 100%; max-width: 450px; box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }

        .header-title { font-size: 14px; font-weight: 800; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; }
        .header-sub { font-size: 10px; color: #94a3b8; margin-top: 2px; }

        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
        .metric-card { background: #1e293b; padding: 8px 10px; border-radius: 8px; border: 1px solid #334155; }
        .metric-label { font-size: 9px; color: #94a3b8; text-transform: uppercase; }
        .metric-value { font-size: 13px; font-weight: 700; color: #38bdf8; font-family: monospace; }

        .ai-hint-box {
            background: rgba(56, 189, 248, 0.08); border-left: 3px solid #38bdf8;
            padding: 10px; border-radius: 6px; font-size: 11px; color: #cbd5e1; line-height: 1.4; margin-bottom: 12px;
        }

        .btn {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #0284c7, #2563eb);
            border: none; border-radius: 10px; color: #fff; font-weight: 700; font-size: 11px;
            text-transform: uppercase; letter-spacing: 1px; cursor: pointer; margin-top: 6px;
        }
        .btn:active { transform: scale(0.98); }

        .slider-control { margin-bottom: 10px; }
        .slider-control label { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
        input[type=range] { width: 100%; accent-color: #38bdf8; cursor: pointer; }

        .route-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
        .tab-btn {
            flex: 1; padding: 8px; background: #1e293b; border: 1px solid #334155;
            border-radius: 6px; font-size: 9px; color: #94a3b8; cursor: pointer; text-align: center;
        }
        .tab-btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; font-weight: 700; }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div class="hud-layer">
    <!-- ВЕРХНИЙ ЗАГОЛОВОК -->
    <div class="glass-panel" style="align-self: flex-start;">
        <div class="header-title">Лаборатория Орбитальной Механики</div>
        <div class="header-sub">Центр «Космонавтика и авиация» | Проект «Каллисто-2028»</div>
    </div>

    <!-- ОСНОВНАЯ ПАНЕЛЬ БАЛЛИСТИКОВ -->
    <div id="ui-calculator" class="glass-panel interactive" style="align-self: center;">
        
        <div class="route-tabs">
            <div class="tab-btn active" onclick="setRoute(1)">Венера-Земля (VEEGA)</div>
            <div class="tab-btn" onclick="setRoute(2)">Марс (Марсианский)</div>
            <div class="tab-btn" onclick="setRoute(3)">Прямой перелёт</div>
        </div>

        <div class="slider-control">
            <label><span>Окно старта (Дата):</span> <b id="lbl-date" style="color: #38bdf8;">2028.05.15</b></label>
            <input type="range" id="slider-date" min="0" max="720" value="120" oninput="calculateTrajectory()">
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">Время в пути</div>
                <div class="metric-value" id="val-time">3 года 2 мес.</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Расход топлива (ΔV)</div>
                <div class="metric-value" id="val-dv">12.4 км/с</div>
            </div>
        </div>

        <div class="ai-hint-box" id="ai-hint">
            Загрузка баллистических данных...
        </div>

        <button class="btn" onclick="confirmTrajectory()">🚀 УТВЕРДИТЬ ТРАЕКТОРИЮ И ВЫБРАТЬ РАКЕТУ</button>
    </div>
</div>

<script>
    let scene, camera, renderer;
    let planets = {};
    let trajectoryLine;
    let selectedRouteType = 1; // 1: VEEGA, 2: Mars, 3: Direct

    init();
    animate();

    function init() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 110, 130);
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x334466));
        const sunLight = new THREE.PointLight(0xffffff, 2, 500);
        scene.add(sunLight);

        // Солнце
        const sun = new THREE.Mesh(new THREE.SphereGeometry(6, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffaa00 }));
        scene.add(sun);

        // Создаем планеты (радиус орбиты, размер, цвет, период обращения)
        planets.venus = createPlanet(18, 1.2, 0xeab308, 0.615);
        planets.earth = createPlanet(28, 1.5, 0x38bdf8, 1.0);
        planets.mars = createPlanet(40, 1.0, 0xef4444, 1.88);
        planets.jupiter = createPlanet(75, 4.0, 0xd97706, 11.86);

        // Линия расчетной траектории
        const lineGeo = new THREE.BufferGeometry();
        trajectoryLine = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0x38bdf8, linewidth: 2 }));
        scene.add(trajectoryLine);

        calculateTrajectory();
        window.addEventListener('resize', onWindowResize);
    }

    function createPlanet(radius, size, color, period) {
        // Отрисовка орбиты
        const orbGeo = new THREE.BufferGeometry();
        const pts = [];
        for(let i=0; i<=64; i++) {
            let a = (i/64) * Math.PI * 2;
            pts.push(new THREE.Vector3(Math.cos(a)*radius, 0, Math.sin(a)*radius));
        }
        orbGeo.setFromPoints(pts);
        scene.add(new THREE.Line(orbGeo, new THREE.LineBasicMaterial({ color: 0xffffff, opacity: 0.15, transparent: true })));

        const mesh = new THREE.Mesh(new THREE.SphereGeometry(size, 32, 32), new THREE.MeshStandardMaterial({ color: color }));
        scene.add(mesh);
        return { mesh, radius, period, angle: 0 };
    }

    function setRoute(type) {
        selectedRouteType = type;
        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', idx === type - 1);
        });
        calculateTrajectory();
    }

    function calculateTrajectory() {
        const dayOffset = parseInt(document.getElementById('slider-date').value);

        // Вращаем планеты согласно дате
        for(let k in planets) {
            let p = planets[k];
            p.angle = (dayOffset / (p.period * 365)) * Math.PI * 2;
            p.mesh.position.x = Math.cos(p.angle) * p.radius;
            p.mesh.position.z = Math.sin(p.angle) * p.radius;
        }

        // Вычисление даты
        let startDate = new Date(2028, 0, 1);
        startDate.setDate(startDate.getDate() + dayOffset);
        document.getElementById('lbl-date').innerText = startDate.toISOString().split('T')[0];

        // Баллистические координаты
        let pE = planets.earth.mesh.position;
        let pJ = planets.jupiter.mesh.position;
        let pV = planets.venus.mesh.position;
        let pM = planets.mars.mesh.position;

        let points = [pE.clone()];
        let timeYears = 0;
        let deltaV = 0;
        let hintText = "";

        if(selectedRouteType === 1) { // VEEGA (Венера)
            points.push(pV.clone(), pE.clone(), pJ.clone());
            let d1 = pE.distanceTo(pV);
            let d2 = pV.distanceTo(pJ);
            
            // Идеальный угол сопряжения Венера-Земля
            let alignment = Math.abs(pV.x - pE.x);
            if(alignment < 15) {
                timeYears = 3.2; deltaV = 11.8;
                hintText = "<b>✅ ИДЕАЛЬНОЕ ОКНО!</b> Венера находится в геометрии ускорения. Гравитационный манёвр сэкономит 45% топлива!";
            } else {
                timeYears = 4.1; deltaV = 16.5;
                hintText = "<b>⚠️ НЕОПТИМАЛЬНО:</b> Венера ушла вперёд. Придется давать дополнительный тормозной импульс.";
            }
        } else if(selectedRouteType === 2) { // Марс
            points.push(pM.clone(), pJ.clone());
            timeYears = 4.8; deltaV = 17.2;
            hintText = "<b>ℹ️ МАРСИАНСКИЙ МАНЁВР:</b> Масса Марса мала для мощного разгона. Полёт займет почти 5 лет.";
        } else { // Прямой
            points.push(pJ.clone());
            timeYears = 6.2; deltaV = 24.0;
            hintText = "<b>❌ ПРЯМОЙ ПЕРЕЛЁТ:</b> Огромный перерасход топлива! Ни одна современная ракета не выведет посадочные модули.";
        }

        trajectoryLine.geometry.setFromPoints(points);

        document.getElementById('val-time').innerText = `${timeYears} года`;
        document.getElementById('val-dv').innerText = `${deltaV} км/с`;
        document.getElementById('ai-hint').innerHTML = hintText;
    }

    function confirmTrajectory() {
        alert("Траектория рассчитана и зафиксирована! Нажмите ОК для перехода в цех сборки ракет.");
    }

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }
</script>
</body>
</html>
