<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Посадка на Каллисто</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: #090d16; 
            color: #f3f4f6; 
            padding: 16px; 
            margin: 0; 
            user-select: none;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card { 
            background: #111827; 
            border-radius: 20px; 
            padding: 20px; 
            width: 100%;
            max-width: 380px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); 
            border: 1px solid #1f2937;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .lives-box {
            font-size: 16px;
            letter-spacing: 2px;
        }

        h2 { 
            color: #ffffff; 
            margin: 0; 
            font-size: 18px; 
            font-weight: 700;
        }

        .param-group { 
            margin-bottom: 12px; 
            background: #1f2937; 
            padding: 12px; 
            border-radius: 12px; 
        }
        label { display: flex; justify-content: space-between; font-size: 13px; color: #9ca3af; margin-bottom: 6px; }
        .val { color: #38bdf8; font-weight: 700; font-family: monospace; }
        
        input[type=range] { 
            width: 100%; 
            accent-color: #38bdf8; 
            height: 6px;
            border-radius: 3px;
            background: #374151;
        }

        /* Выбор количества двигателей */
        .engines-select {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }
        .engine-opt {
            flex: 1;
            padding: 8px;
            background: #374151;
            border: 1px solid transparent;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .engine-opt.selected {
            background: #0284c7;
            border-color: #38bdf8;
        }

        #sim-screen { display: none; text-align: center; }
        
        #canvas-container { 
            position: relative; 
            width: 100%; 
            height: 300px; 
            background: #030712; 
            border-radius: 14px; 
            overflow: hidden; 
            border: 1px solid #1f2937;
        }
        canvas { width: 100%; height: 100%; }
        
        .dash { 
            position: absolute; 
            top: 10px; 
            left: 10px; 
            text-align: left; 
            font-family: ui-monospace, monospace; 
            font-size: 11px; 
            color: #e5e7eb; 
            background: rgba(17, 24, 39, 0.9); 
            padding: 8px 10px; 
            border-radius: 8px; 
            border: 1px solid #374151;
            line-height: 1.4; 
        }

        /* Подсказка поднята наверх под дашборд */
        .hint-box { 
            position: absolute; 
            top: 10px; 
            right: 10px; 
            font-size: 11px; 
            font-weight: 600; 
            background: rgba(17, 24, 39, 0.9); 
            padding: 6px 10px; 
            border-radius: 8px; 
            border: 1px solid #374151;
            max-width: 140px;
            text-align: right;
        }

        #engine-btn { 
            width: 100%; 
            padding: 16px; 
            background: #16a34a; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-weight: 700; 
            font-size: 16px; 
            margin-top: 14px; 
            cursor: pointer; 
        }
        #engine-btn.active { 
            background: #dc2626; 
        }

        #result-screen { display: none; text-align: center; padding: 10px 0; }
        .res-title { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
        .success { color: #22c55e; }
        .crash { color: #ef4444; }
        
        .btn-action { 
            width: 100%; 
            padding: 14px; 
            background: #0284c7; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-weight: 700; 
            font-size: 15px; 
            margin-top: 14px; 
            cursor: pointer; 
        }
    </style>
</head>
<body>

<div class="card">
    <!-- Шапка с жизнями -->
    <div class="top-bar">
        <h2>🪐 Посадка на Каллисто</h2>
        <div class="lives-box" id="lives-display">❤️❤️❤️</div>
    </div>

    <!-- 1. Настройка параметров -->
    <div id="setup-screen">
        <div class="param-group">
            <label>Количество двигателей:</label>
            <div class="engines-select">
                <div class="engine-opt" onclick="selectEngines(1, this)">1 Двиг.</div>
                <div class="engine-opt selected" onclick="selectEngines(2, this)">2 Двиг.</div>
                <div class="engine-opt" onclick="selectEngines(3, this)">3 Двиг.</div>
            </div>
        </div>

        <div class="param-group">
            <label>Запас топлива: <span class="val" id="fuel-val">50 кг</span></label>
            <input type="range" id="fuel-input" min="20" max="100" value="50" oninput="document.getElementById('fuel-val').innerText = this.value + ' кг'">
        </div>

        <div class="param-group">
            <label>Масса корпуса: <span class="val" id="mass-val">50 кг</span></label>
            <input type="range" id="mass-input" min="20" max="100" value="50" oninput="document.getElementById('mass-val').innerText = this.value + ' кг'">
        </div>

        <button class="btn-action" onclick="startFlight()">🚀 НАЧАТЬ СПУСК</button>
    </div>

    <!-- 2. Симулятор падения -->
    <div id="sim-screen">
        <div id="canvas-container">
            <div class="dash">
                Высота: <span id="d-alt" style="color:#38bdf8">1000</span> м<br>
                Скорость: <span id="d-vel" style="color:#a855f7">0</span> м/с<br>
                Топливо: <span id="d-fuel" style="color:#22c55e">100</span>%
            </div>
            
            <div id="hint" class="hint-box" style="color:#f59e0b;">💡 Врубай тягу перед землей!</div>
            
            <canvas id="canvas"></canvas>
        </div>
        
        <button id="engine-btn" onclick="toggleEngine()">🔥 ВКЛЮЧИТЬ ТЯГУ</button>
    </div>

    <!-- 3. Итог -->
    <div id="result-screen">
        <div id="res-status" class="res-title"></div>
        <div id="res-desc" style="font-size: 14px; color: #9ca3af; margin-bottom: 16px;"></div>
        <button id="res-btn" class="btn-action" onclick="nextAttempt()">🔄 СЛЕДУЮЩАЯ ПОПЫТКА</button>
    </div>
</div>

<script>
    let lives = 3;
    let numEngines = 2;
    let fuelMass = 50, bodyMass = 50, totalMass = 100;
    let currentFuel = 100;
    let alt = 1000, vel = 20, engineOn = false;
    let loop;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playBeep(freq, type, duration) {
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    function selectEngines(count, elem) {
        numEngines = count;
        document.querySelectorAll('.engine-opt').forEach(el => el.classList.remove('selected'));
        elem.classList.add('selected');
    }

    function updateLivesUI() {
        let h = "";
        for (let i = 0; i < 3; i++) {
            h += i < lives ? "❤️" : "🖤";
        }
        document.getElementById('lives-display').innerText = h;
    }

    function startFlight() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        fuelMass = parseInt(document.getElementById('fuel-input').value);
        bodyMass = parseInt(document.getElementById('mass-input').value);
        totalMass = bodyMass + fuelMass;
        currentFuel = 100;
        
        vel = 20;
        alt = 1000;
        engineOn = false;

        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('sim-screen').style.display = 'block';

        const canvas = document.getElementById('canvas');
        canvas.width = canvas.parentElement.offsetWidth;
        canvas.height = 300;

        loop = setInterval(updatePhysics, 1000/30);
    }

    function toggleEngine() {
        if (currentFuel <= 0 && !engineOn) return;

        engineOn = !engineOn;
        const btn = document.getElementById('engine-btn');

        if (navigator.vibrate) navigator.vibrate(30);

        if (engineOn) {
            btn.innerText = "🛑 ОТКЛЮЧИТЬ ТЯГУ";
            btn.className = "active";
            playBeep(140, 'sawtooth', 0.1);
        } else {
            btn.innerText = "🔥 ВКЛЮЧИТЬ ТЯГУ";
            btn.className = "";
        }
    }

    function updatePhysics() {
        // Расход топлива пропорционален количеству двигателей
        if (engineOn && currentFuel > 0) {
            let burnRate = (numEngines * 12) / fuelMass;
            currentFuel -= burnRate;
            if (currentFuel <= 0) {
                currentFuel = 0;
                if (engineOn) toggleEngine();
            }
        }

        // Физика: гравитация Каллисто vs Тяга двигателей
        let gravity = 0.15 + (totalMass * 0.001); 
        // Чем больше двигателей, тем больше сила тяги
        let thrust = (engineOn && currentFuel > 0) ? (numEngines * 0.35) : 0; 

        let accel = gravity - thrust;
        vel += accel;

        if (vel < -4) vel = -4; // Лимит скорости на взлет

        alt -= vel * 0.35;

        // Телеметрия
        document.getElementById('d-alt').innerText = Math.max(0, Math.round(alt));
        document.getElementById('d-vel').innerText = vel.toFixed(1);
        
        const fElem = document.getElementById('d-fuel');
        fElem.innerText = Math.round(currentFuel);

        // Подсказки сверху
        const hint = document.getElementById('hint');
        if (currentFuel <= 0) {
            hint.innerText = "⚠️ Топливо кончилось!";
            hint.style.color = "#ef4444";
        } else if (vel <= 7.0) {
            hint.innerText = "✅ Хорошая скорость!";
            hint.style.color = "#22c55e";
        } else {
            hint.innerText = "💡 Гаси скорость!";
            hint.style.color = "#f59e0b";
        }

        draw();

        // Улетел за 2000м
        if (alt >= 2000) {
            clearInterval(loop);
            showResult("space");
        }

        // Касание земли
        if (alt <= 0) {
            clearInterval(loop);
            showResult(vel <= 7.0 ? "success" : "crash");
        }
    }

    function draw() {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;

        ctx.clearRect(0, 0, w, h);

        // Поверхность Каллисто (вид снизу ничем не закрывается!)
        ctx.fillStyle = '#374151';
        ctx.fillRect(0, h - 20, w, 20);

        let y = h - 20 - (alt * (h - 80) / 1000) - 20;
        if (y < 20) y = 20;

        // Посадочный модуль
        ctx.fillStyle = '#9ca3af';
        ctx.fillRect(w/2 - 14, y, 28, 16);
        
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(w/2 - 6, y + 3, 12, 5);

        // Стойки
        ctx.strokeStyle = '#6b7280';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(w/2 - 14, y + 16); ctx.lineTo(w/2 - 20, y + 22);
        ctx.moveTo(w/2 + 14, y + 16); ctx.lineTo(w/2 + 20, y + 22);
        ctx.stroke();

        // Отрисовка нескольких сопел пламени в зависимости от числа двигателей
        if (engineOn && currentFuel > 0) {
            ctx.fillStyle = '#f97316';
            if (numEngines === 1) {
                ctx.beginPath();
                ctx.moveTo(w/2 - 6, y + 16); ctx.lineTo(w/2 + 6, y + 16); ctx.lineTo(w/2, y + 32);
                ctx.fill();
            } else if (numEngines === 2) {
                ctx.beginPath();
                ctx.moveTo(w/2 - 10, y + 16); ctx.lineTo(w/2 - 2, y + 16); ctx.lineTo(w/2 - 6, y + 30);
                ctx.moveTo(w/2 + 2, y + 16); ctx.lineTo(w/2 + 10, y + 16); ctx.lineTo(w/2 + 6, y + 30);
                ctx.fill();
            } else {
                ctx.beginPath();
                ctx.moveTo(w/2 - 12, y + 16); ctx.lineTo(w/2 - 6, y + 16); ctx.lineTo(w/2 - 9, y + 28);
                ctx.moveTo(w/2 - 4, y + 16); ctx.lineTo(w/2 + 4, y + 16); ctx.lineTo(w/2, y + 32);
                ctx.moveTo(w/2 + 6, y + 16); ctx.lineTo(w/2 + 12, y + 16); ctx.lineTo(w/2 + 9, y + 28);
                ctx.fill();
            }
        }
    }

    function showResult(type) {
        document.getElementById('sim-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        const status = document.getElementById('res-status');
        const desc = document.getElementById('res-desc');
        const resBtn = document.getElementById('res-btn');

        if (type === "success") {
            playBeep(600, 'sine', 0.3);
            status.innerText = "🎉 ПОСАДКА УСПЕШНА!";
            status.className = "res-title success";
            desc.innerText = `Мягкое касание! Скорость: ${vel.toFixed(1)} м/с. Отличная работа!`;
            resBtn.innerText = "🔄 Сыграть ещё раз";
        } else {
            lives--;
            updateLivesUI();
            playBeep(90, 'square', 0.4);

            if (lives > 0) {
                status.innerText = type === "space" ? "🌌 УЛЕТЕЛ В КОСМОС!" : "💥 ВЗРЫВ ПРИ УДАРЕ!";
                status.className = "res-title crash";
                desc.innerText = `Скорость касания: ${vel.toFixed(1)} м/с (Лимит: до 7.0 м/с). Осталось жизней: ${lives}.`;
                resBtn.innerText = "🔄 Попробовать снова";
            } else {
                status.innerText = "💀 GAME OVER!";
                status.className = "res-title crash";
                desc.innerText = "Все 3 жизни израсходованы! Попробуй сменить число двигателей или массу.";
                resBtn.innerText = "🚀 Начать с начала";
            }
        }
    }

    function nextAttempt() {
        if (lives <= 0) {
            lives = 3;
            updateLivesUI();
        }
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('setup-screen').style.display = 'block';
    }

    updateLivesUI();
</script>

</body>
</html>
