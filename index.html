<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Посадка Марсохода</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 15px; margin: 0; user-select: none; }
        .card { background: #1e293b; border-radius: 16px; padding: 20px; max-width: 380px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h2 { color: #f97316; margin: 0 0 15px 0; text-align: center; text-transform: uppercase; font-size: 18px; }
        
        .param-group { margin-bottom: 12px; background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #334155; }
        label { display: flex; justify-content: space-between; font-size: 13px; color: #94a3b8; margin-bottom: 5px; }
        .val { color: #38bdf8; font-weight: bold; }
        input[type=range] { width: 100%; accent-color: #f97316; }

        #sim-screen { display: none; text-align: center; }
        #canvas-container { position: relative; width: 100%; height: 260px; background: #020617; border-radius: 12px; overflow: hidden; border: 1px solid #334155; }
        canvas { width: 100%; height: 100%; }
        
        .dash { position: absolute; top: 10px; left: 10px; text-align: left; font-family: monospace; font-size: 12px; color: #38bdf8; background: rgba(15, 23, 42, 0.85); padding: 8px; border-radius: 6px; }

        /* Кнопка вкл/выкл двигателя */
        #engine-btn { width: 100%; padding: 16px; background: #22c55e; color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 18px; margin-top: 15px; cursor: pointer; }
        #engine-btn.active { background: #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); }

        #result-screen { display: none; text-align: center; }
        .res-title { font-size: 22px; font-weight: bold; margin-bottom: 10px; }
        .success { color: #22c55e; }
        .crash { color: #ef4444; }
        
        .btn-action { width: 100%; padding: 12px; background: #f97316; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; margin-top: 15px; cursor: pointer; }
        .spec-box { background: #0f172a; padding: 12px; border-radius: 8px; text-align: left; font-size: 13px; margin-top: 10px; border-left: 3px solid #38bdf8; }
    </style>
</head>
<body>

<div class="card">
    <!-- 1. Настройка параметров -->
    <div id="setup-screen">
        <h2>🛠️ Параметры Аппарата</h2>
        
        <div class="param-group">
            <label>Масса аппарата: <span class="val" id="mass-val">50 кг</span></label>
            <input type="range" id="mass" min="20" max="100" value="50" oninput="document.getElementById('mass-val').innerText = this.value + ' кг'">
        </div>

        <div class="param-group">
            <label>Диаметр парашюта: <span class="val" id="chute-val">30 см</span></label>
            <input type="range" id="chute" min="10" max="60" value="30" oninput="document.getElementById('chute-val').innerText = this.value + ' см'">
        </div>

        <div class="param-group">
            <label>Начальная скорость падения: <span class="val" id="speed-val">20 м/с</span></label>
            <input type="range" id="speed" min="10" max="50" value="20" oninput="document.getElementById('speed-val').innerText = this.value + ' м/с'">
        </div>

        <button class="btn-action" onclick="startFlight()">🚀 Начать посадку</button>
    </div>

    <!-- 2. Симулятор падения -->
    <div id="sim-screen">
        <h2>🛰️ Посадка в процессе</h2>
        <div id="canvas-container">
            <div class="dash">
                Высота: <span id="d-alt">500</span> м<br>
                Скорость: <span id="d-vel">0</span> м/с<br>
                Двигатель: <span id="d-eng" style="color:#ef4444">ВЫКЛ</span>
            </div>
            <canvas id="canvas"></canvas>
        </div>
        
        <button id="engine-btn" onclick="toggleEngine()">🔥 ВКЛЮЧИТЬ ДВИГАТЕЛЬ</button>
    </div>

    <!-- 3. Итог -->
    <div id="result-screen">
        <div id="res-status" class="res-title"></div>
        <div id="res-desc" style="font-size: 14px; color: #94a3b8;"></div>
        
        <div id="tz-box" class="spec-box" style="display:none;">
            <b style="color:#38bdf8;">📋 ТЗ на сборку мода:</b><br>
            • Собрать парашют диаметром: <b id="tz-chute"></b><br>
            • Сделать амортизаторов: <b id="tz-dampers"></b><br>
            • Утяжелить модуль маркерами: <b id="tz-mass"></b>
        </div>

        <button class="btn-action" onclick="location.reload()">Попробовать снова</button>
    </div>
</div>

<script>
    let mass, chute, initSpeed;
    let alt = 500, vel = 0, engineOn = false;
    let loop;

    function startFlight() {
        mass = parseInt(document.getElementById('mass').value);
        chute = parseInt(document.getElementById('chute').value);
        initSpeed = parseInt(document.getElementById('speed').value);
        vel = initSpeed;

        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('sim-screen').style.display = 'block';

        const canvas = document.getElementById('canvas');
        canvas.width = canvas.parentElement.offsetWidth;
        canvas.height = 260;

        loop = setInterval(updatePhysics, 1000/30);
    }

    function toggleEngine() {
        engineOn = !engineOn;
        const btn = document.getElementById('engine-btn');
        const dashEng = document.getElementById('d-eng');

        if (engineOn) {
            btn.innerText = "🛑 ВЫКЛЮЧИТЬ ДВИГАТЕЛЬ";
            btn.className = "active";
            dashEng.innerText = "ВКЛ";
            dashEng.style.color = "#22c55e";
        } else {
            btn.innerText = "🔥 ВКЛЮЧИТЬ ДВИГАТЕЛЬ";
            btn.className = "";
            dashEng.innerText = "ВЫКЛ";
            dashEng.style.color = "#ef4444";
        }
    }

    function updatePhysics() {
        // Сопротивление воздуха парашюта (чем больше парашют, тем сильнее тормозит)
        let drag = (chute * 0.005) / (mass * 0.02);
        // Гравитация
        let gravity = 0.3 + (mass * 0.005);
        // Тяга двигателя
        let thrust = engineOn ? 1.2 : 0;

        // Итоговое ускорение
        let accel = gravity - drag - thrust;
        vel += accel;

        // Ограничение минимальной скорости падения
        if (vel < -5) vel = -5; // не даем лететь в космос вверх

        alt -= vel * 0.3;

        // Дашборд
        document.getElementById('d-alt').innerText = Math.max(0, Math.round(alt));
        document.getElementById('d-vel').innerText = vel.toFixed(1);

        draw();

        // Касание земли
        if (alt <= 0) {
            clearInterval(loop);
            showResult();
        }
    }

    function draw() {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;

        ctx.clearRect(0, 0, w, h);

        // Поверхность Марса
        ctx.fillStyle = '#b45309';
        ctx.fillRect(0, h - 20, w, 20);

        // Позиция ровера
        let y = h - 20 - (alt * (h - 80) / 500) - 20;

        // Парашют
        if (chute > 0) {
            ctx.fillStyle = '#f97316';
            ctx.beginPath();
            ctx.arc(w/2, y - 20, chute/2, Math.PI, 0);
            ctx.fill();
            // Стропы
            ctx.strokeStyle = '#64748b';
            ctx.beginPath();
            ctx.moveTo(w/2 - chute/2, y - 20); ctx.lineTo(w/2, y);
            ctx.moveTo(w/2 + chute/2, y - 20); ctx.lineTo(w/2, y);
            ctx.stroke();
        }

        // Аппарат
        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(w/2 - 12, y, 24, 16);

        // Пламя двигателя
        if (engineOn) {
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.moveTo(w/2 - 8, y + 16);
            ctx.lineTo(w/2 + 8, y + 16);
            ctx.lineTo(w/2, y + 32);
            ctx.fill();
        }
    }

    function showResult() {
        document.getElementById('sim-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        const status = document.getElementById('res-status');
        const desc = document.getElementById('res-desc');
        const tzBox = document.getElementById('tz-box');

        if (vel <= 4.0) {
            status.innerText = "🎉 МЯГКАЯ ПОСАДКА!";
            status.className = "res-title success";
            desc.innerText = `Скорость касания: ${vel.toFixed(1)} м/с. Отличная работа пилота!`;
            
            // Заполнение ТЗ
            document.getElementById('tz-chute').innerText = chute + " см";
            document.getElementById('tz-dampers').innerText = mass > 60 ? "4 зоны" : "2 зоны";
            document.getElementById('tz-mass').innerText = mass > 60 ? "3 маркера" : "1 маркер";
            tzBox.style.display = "block";
        } else {
            status.innerText = "💥 КРАШ-ТЕСТ НЕ ПРОЙДЕН!";
            status.className = "res-title crash";
            desc.innerText = `Скорость касания: ${vel.toFixed(1)} м/с (Лимит — 4.0 м/с). Модуль разбился! Измени параметры или вовремя включай двигатель.`;
        }
    }
</script>

</body>
</html>
