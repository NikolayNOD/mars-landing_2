<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Центр Управления Посадкой: Марс-1</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; margin: 0; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; max-width: 400px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h2 { color: #f97316; margin-top: 0; text-align: center; text-transform: uppercase; font-size: 20px; letter-spacing: 1px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; margin-bottom: 5px; color: #94a3b8; }
        input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #f97316; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        button:hover { background: #ea580c; }
        #result { margin-top: 20px; padding: 15px; background: #0f172a; border-radius: 8px; border-left: 4px solid #f97316; display: none; }
        .spec-item { margin: 8px 0; font-size: 15px; display: flex; justify-content: space-between; }
        .spec-value { font-weight: bold; color: #38bdf8; }
    </style>
</head>
<body>

<div class="card">
    <h2>🚀 Расчет Посадки «Марс-1»</h2>
    <p style="font-size: 13px; color: #94a3b8; text-align: center;">Введите параметры посадочного модуля для получения ТЗ на сборку</p>
    
    <div class="input-group">
        <label>Вес научного груза (Маркера):</label>
        <select id="weight">
            <option value="light">Легкий (1 маркер / ~15г)</option>
            <option value="heavy">Тяжелый (3 маркер / ~45г)</option>
        </select>
    </div>

    <div class="input-group">
        <label>Плотность атмосферы планеты:</label>
        <select id="atmosphere">
            <option value="thin">Разреженная (Марсианский тип)</option>
            <option value="dense">Плотная (Венерианский тип)</option>
        </select>
    </div>

    <div class="input-group">
        <label>Желаемая скорость спуска:</label>
        <input type="range" id="speed" min="1" max="5" value="3">
        <div style="display: flex; justify-content: space-between; font-size: 11px; color: #64748b;">
            <span>Медленно (Безопасно)</span>
            <span>Быстро (Опасно)</span>
        </div>
    </div>

    <button onclick="calculate()">Рассчитать ТЗ на сборку</button>

    <div id="result">
        <h3 style="color: #38bdf8; margin-top:0; font-size: 16px;">📋 Инженерный Чертеж:</h3>
        <div class="spec-item"><span>Минимальный диаметр купола:</span> <span class="spec-value" id="res-parachute">-</span></div>
        <div class="spec-item"><span>Количество амортизаторов:</span> <span class="spec-value" id="res-dampers">-</span></div>
        <div class="spec-item"><span>Лимит скотча на каркас:</span> <span class="spec-value" id="res-tape">-</span></div>
        <div class="spec-item"><span>Разрешено бумажных листов:</span> <span class="spec-value" id="res-paper">-</span></div>
        <div style="margin-top: 10px; padding: 8px; background: #1e293b; border-radius: 4px; font-size: 12px; color: #f59e0b; text-align: center;" id="res-warning"></div>
    </div>
</div>

<script>
function calculate() {
    const weight = document.getElementById('weight').value;
    const atmosphere = document.getElementById('atmosphere').value;
    const speed = parseInt(document.getElementById('speed').value);

    let parachute = "20 см";
    let dampers = "2 зоны (стаканчики)";
    let tape = "50 см";
    let paper = "2 листа";
    let warning = "Стандартный расчет. Фиксируйте груз жестко!";

    if (atmosphere === 'thin') {
        parachute = speed < 3 ? "35–40 см (Большой купол)" : "25 см";
        warning = "⚠️ Разреженная атмосфера: требуется увеличенная площадь парашюта!";
    } else {
        parachute = "15–20 см (Малый купол)";
        warning = "⚠️ Плотная атмосфера: упор на стойкость к боковому дрейфу.";
    }

    if (weight === 'heavy') {
        dampers = "4 зоны (многоуровневые ноги)";
        paper = "3 листа";
        tape = "80 см";
        warning += " Груз тяжелый — делайте двойное дно!";
    }

    document.getElementById('res-parachute').innerText = parachute;
    document.getElementById('res-dampers').innerText = dampers;
    document.getElementById('res-tape').innerText = tape;
    document.getElementById('res-paper').innerText = paper;
    document.getElementById('res-warning').innerText = warning;

    document.getElementById('result').style.display = 'block';
}
</script>

</body>
</html>
