<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Посадка на Каллисто</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: #090d16; 
            color: #f3f4f6; 
            padding: 16px; 
            margin: 0; 
            user-select: none;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card { 
            background: #111827; 
            border-radius: 20px; 
            padding: 20px; 
            width: 100%;
            max-width: 380px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); 
            border: 1px solid #1f2937;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .lives-box { font-size: 16px; letter-spacing: 2px; }

        h2 { color: #ffffff; margin: 0; font-size: 18px; font-weight: 700; }

        .param-group { 
            margin-bottom: 14px; 
            background: #1f2937; 
            padding: 14px; 
            border-radius: 12px; 
        }
        label { display: flex; justify-content: space-between; font-size: 13px; color: #9ca3af; margin-bottom: 8px; }
        .val { color: #38bdf8; font-weight: 700; font-family: monospace; }
        
        input[type=range] { 
            width: 100%; 
            accent-color: #38bdf8; 
            height: 6px;
            border-radius: 3px;
            background: #374151;
        }

        .engines-select { display: flex; gap: 8px; margin-top: 4px; }
        .engine-opt {
            flex: 1;
            padding: 10px;
            background: #374151;
            border: 1px solid transparent;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .engine-opt.selected { background: #0284c7; border-color: #38bdf8; }

        #sim-screen { display: none; text-align: center; }
        
        #canvas-container { 
            position: relative; 
            width: 100%; 
            height: 280px; 
            background: #030712; 
            border-radius: 14px; 
            overflow: hidden; 
            border: 1px solid #1f2937;
        }
        canvas { width: 100%; height: 100%; }
        
        .dash { 
            position: absolute; 
            top: 10px; 
            left: 10px; 
            text-align: left; 
            font-family: ui-monospace, monospace; 
            font-size: 12px; 
            color: #e5e7eb; 
            background: rgba(17, 24, 39, 0.9); 
            padding: 8px 12px; 
            border-radius: 8px; 
            border: 1px solid #374151;
            line-height: 1.5; 
        }

        .hint-box { 
            position: absolute; 
            top: 10px; 
            right: 10px; 
            font-size: 11px; 
            font-weight: 700; 
            background: rgba(17, 24, 39, 0.9); 
            padding: 6px 10px; 
            border-radius: 8px; 
            border: 1px solid #374151;
            max-width: 140px;
            text-align: right;
        }

        /* Управление режимами тяги */
        .thrust-controls {
            display: flex;
            gap: 6px;
            margin-top: 12px;
        }
        .t-btn {
            flex: 1;
            padding: 14px 4px;
            background: #374151;
            border: 2px solid transparent;
            border-radius: 10px;
            color: white;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }
        .t-btn.off.active { background: #4b5563; border-color: #9ca3af; }
        .t-btn.mid.active { background: #d97706; border-color: #f59e0b; }
        .t-btn.max.active { background: #dc2626; border-color: #ef4444; }

        #result-screen { display: none; text-align: center; padding: 10px 0; }
        .res-title { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
        .success { color: #22c55e; }
        .warning { color: #f59e0b; }
        .crash { color: #ef4444; }
        
        .btn-action { 
            width: 100%; 
            padding: 14px; 
            background: #0284c7; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-weight: 700; 
            font-size: 15px; 
            margin-top: 14px; 
            cursor: pointer; 
        }
    </style>
</head>
<body>

<div class="card">
    <div class="top-bar">
        <h2>🪐 Посадка на Каллисто</h2>
        <div class="lives-box" id="lives-display">❤️❤️❤️</div>
    </div>

    <!-- 1. Настройка параметров -->
    <div id="setup-screen">
        <div class="param-group">
            <label>Тип сопла двигателей:</label>
            <div class="engines-select">
                <div class="engine-opt" onclick="selectEngines(1, this)">1 Двиг.</div>
                <div class="engine-opt selected" onclick="selectEngines(2, this)">2 Двиг.</div>
                <div class="engine-opt" onclick="selectEngines(3, this)">3 Двиг.</div>
            </div>
        </div>

        <div class="param-group">
            <label>Запас топлива (Масса): <span class="val" id="fuel-val">60 %</span></label>
            <input type="range" id="fuel-input" min="30" max="100" value="60" oninput="document.getElementById('fuel-val').innerText = this.value + ' %'">
            <div style="font-size: 11px; color: #6b7280; margin-top: 6px;">💡 Чем больше топлива, тем тяжелее корабль!</div>
        </div>

        <button class="btn-action" onclick="startFlight()">🚀 НАЧАТЬ СПУСК</button>
    </div>

    <!-- 2. Симулятор падения -->
    <div id="sim-screen">
        <div id="canvas-container">
            <div class="dash">
                Высота: <span id="d-alt" style="color:#38bdf8">1000</span> м<br>
                Скорость: <b id="d-vel">0.0</b> м/с<br>
                Топливо: <span id="d-fuel" style="color:#22c55e">100</span>%
            </div>
            
            <div id="hint" class="hint-box" style="color:#f59e0b;">💡 Выбирай режим тяги!</div>
            
            <canvas id="canvas"></canvas>
        </div>
        
        <!-- Переключатель мощностей -->
        <div class="thrust-controls">
            <button class="t-btn off active" onclick="setThrust(0)">🛑 ВЫКЛ</button>
            <button class="t-btn mid" onclick="setThrust(0.5)">⚡ 50%</button>
            <button class="t-btn max" onclick="setThrust(1.0)">🔥 100%</button>
        </div>
    </div>

    <!-- 3. Итог -->
    <div id="result-screen">
        <div id="res-status" class="res-title"></div>
        <div id="res-desc" style="font-size: 14px; color: #9ca3af; margin-bottom: 16px;"></div>
        <button id="res-btn" class="btn-action" onclick="nextAttempt()">🔄 СЛЕДУЮЩАЯ ПОПЫТКА</button>
    </div>
</div>

<script>
    let lives = 3;
    let numEngines = 2;
    let fuelCap = 60, currentFuel = 100;
    let alt = 1000, vel = 15, thrustLevel = 0; 
    let loop;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playBeep(freq, type, duration) {
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    function selectEngines(count, elem) {
        numEngines = count;
        document.querySelectorAll('.engine-opt').forEach(el => el.classList.remove('selected'));
        elem.classList.add('selected');
    }

    function updateLivesUI() {
        let h = "";
        for (let i = 0; i < 3; i++) {
            h += i < lives ? "❤️" : "🖤";
        }
        document.getElementById('lives-display').innerText = h;
    }

    function startFlight() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        fuelCap = parseInt(document.getElementById('fuel-input').value);
        currentFuel = fuelCap;
        
        vel = 15;
        alt = 1000;
        thrustLevel = 0;
        updateThrustUI();

        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('sim-screen').style.display = 'block';

        const canvas = document.getElementById('canvas');
        canvas.width = canvas.parentElement.offsetWidth;
        canvas.height = 280;

        loop = setInterval(updatePhysics, 1000/30);
    }

    function setThrust(level) {
        if (currentFuel <= 0 && level > 0) return;
        
        thrustLevel = level;
        updateThrustUI();
        if (navigator.vibrate) navigator.vibrate(25);
        
        if (thrustLevel > 0) {
            playBeep(120 + thrustLevel * 80, 'sawtooth', 0.1);
        }
    }

    function updateThrustUI() {
        const btns = document.querySelectorAll('.t-btn');
        btns.forEach(b => b.classList.remove('active'));
        if (thrustLevel === 0) btns[0].classList.add('active');
        else if (thrustLevel === 0.5) btns[1].classList.add('active');
        else if (thrustLevel === 1.0) btns[2].classList.add('active');
    }

    function updatePhysics() {
        // Расход топлива зависит от уровня тяги и числа двигателей
        if (thrustLevel > 0 && currentFuel > 0) {
            currentFuel -= (numEngines * thrustLevel * 0.35);
            if (currentFuel <= 0) {
                currentFuel = 0;
                setThrust(0);
            }
        }

        // Зависимость гравитации от оставшейся массы топлива (Физика!)
        let massFactor = 0.18 + (currentFuel * 0.0012); 
        
        // Сила тяги двигателей
        let thrustPower = (numEngines * thrustLevel * 0.38); 

        vel += (massFactor - thrustPower);
        if (vel < -3) vel = -3; // Ограничение на скорость подъема

        alt -= vel * 0.35;

        // Телеметрия
        document.getElementById('d-alt').innerText = Math.max(0, Math.round(alt));
        
        const velElem = document.getElementById('d-vel');
        velElem.innerText = vel.toFixed(1);
        
        // Цвет скорости
        if (vel <= 4.0) velElem.style.color = "#22c55e";
        else if (vel <= 9.0) velElem.style.color = "#f59e0b";
        else velElem.style.color = "#ef4444";
        
        document.getElementById('d-fuel').innerText = Math.round(currentFuel);

        // Подсказка
        const hint = document.getElementById('hint');
        if (currentFuel <= 0) {
            hint.innerText = "⚠️ Топливо кончилось!";
            hint.style.color = "#ef4444";
        } else if (vel <= 4.0) {
            hint.innerText = "🌟 Идеальная скорость!";
            hint.style.color = "#22c55e";
        } else if (vel <= 9.0) {
            hint.innerText = "⚠️ Будет жестковато!";
            hint.style.color = "#f59e0b";
        } else {
            hint.innerText = "🔴 Гаси скорость!";
            hint.style.color = "#ef4444";
        }

        draw();

        if (alt >= 2000) {
            clearInterval(loop);
            showResult("space");
        }

        if (alt <= 0) {
            clearInterval(loop);
            if (vel <= 4.0) showResult("perfect");
            else if (vel <= 9.0) showResult("hard");
            else showResult("crash");
        }
    }

    function draw() {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;

        ctx.clearRect(0, 0, w, h);

        // Поверхность
        ctx.fillStyle = '#374151';
        ctx.fillRect(0, h - 20, w, 20);

        let y = h - 20 - (alt * (h - 80) / 1000) - 20;
        if (y < 20) y = 20;

        // Корабль
        ctx.fillStyle = '#9ca3af';
        ctx.fillRect(w/2 - 14, y, 28, 16);
        
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(w/2 - 6, y + 3, 12, 5);

        // Стойки
        ctx.strokeStyle = '#6b7280';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(w/2 - 14, y + 16); ctx.lineTo(w/2 - 20, y + 22);
        ctx.moveTo(w/2 + 14, y + 16); ctx.lineTo(w/2 + 20, y + 22);
        ctx.stroke();

        // Отрисовка пламени в зависимости от мощности
        if (thrustLevel > 0 && currentFuel > 0) {
            ctx.fillStyle = thrustLevel === 1.0 ? '#ef4444' : '#f97316';
            let flameLen = thrustLevel * 16;

            if (numEngines === 1) {
                ctx.beginPath();
                ctx.moveTo(w/2 - 5, y + 16); ctx.lineTo(w/2 + 5, y + 16); ctx.lineTo(w/2, y + 16 + flameLen); ctx.fill();
            } else if (numEngines === 2) {
                ctx.beginPath();
                ctx.moveTo(w/2 - 10, y + 16); ctx.lineTo(w/2 - 2, y + 16); ctx.lineTo(w/2 - 6, y + 16 + flameLen);
                ctx.moveTo(w/2 + 2, y + 16); ctx.lineTo(w/2 + 10, y + 16); ctx.lineTo(w/2 + 6, y + 16 + flameLen); ctx.fill();
            } else {
                ctx.beginPath();
                ctx.moveTo(w/2 - 12, y + 16); ctx.lineTo(w/2 - 6, y + 16); ctx.lineTo(w/2 - 9, y + 16 + flameLen);
                ctx.moveTo(w/2 - 4, y + 16); ctx.lineTo(w/2 + 4, y + 16); ctx.lineTo(w/2, y + 16 + flameLen * 1.2);
                ctx.moveTo(w/2 + 6, y + 16); ctx.lineTo(w/2 + 12, y + 16); ctx.lineTo(w/2 + 9, y + 16 + flameLen); ctx.fill();
            }
        }
    }

    function showResult(type) {
        document.getElementById('sim-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        const status = document.getElementById('res-status');
        const desc = document.getElementById('res-desc');
        const resBtn = document.getElementById('res-btn');

        if (type === "perfect") {
            playBeep(600, 'sine', 0.3);
            status.innerText = "🌟 ИДЕАЛЬНАЯ ПОСАДКА!";
            status.className = "res-title success";
            desc.innerText = `Ювелирная точность! Скорость: ${vel.toFixed(1)} м/с. Корабль цел, экипаж ликует!`;
            resBtn.innerText = "🔄 Сыграть ещё раз";
        } else if (type === "hard") {
            lives--;
            updateLivesUI();
            playBeep(300, 'triangle', 0.3);
            status.innerText = "⚠️ ЖЕСТКАЯ ПОСАДКА!";
            status.className = "res-title warning";
            desc.innerText = `Скорость: ${vel.toFixed(1)} м/с. Шасси сломаны (-1 жизнь), но экипаж спасен!`;
            resBtn.innerText = lives > 0 ? "🔄 Попробовать улучшить" : "🚀 Начать с начала";
        } else {
            lives--;
            updateLivesUI();
            playBeep(90, 'square', 0.4);

            status.innerText = type === "space" ? "🌌 УЛЕТЕЛ В КОСМОС!" : "💥 АВАРИЯ!";
            status.className = "res-title crash";
            desc.innerText = `Скорость касания: ${vel.toFixed(1)} м/с. Слишком жестко!`;
            resBtn.innerText = lives > 0 ? "🔄 Попробовать снова" : "🚀 Начать с начала";
        }
    }

    function nextAttempt() {
        if (lives <= 0) {
            lives = 3;
            updateLivesUI();
        }
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('setup-screen').style.display = 'block';
    }

    updateLivesUI();
</script>

</body>
</html>
