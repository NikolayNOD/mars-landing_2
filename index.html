<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Callisto: Orbital Drop</title>
    <style>
        :root { --primary: #00e5ff; --danger: #ff3366; --bg: rgba(10, 15, 25, 0.85); }
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Consolas', 'Courier New', monospace; color: #fff; user-select: none; }
        #game-canvas { position: absolute; top: 0; left: 0; z-index: 1; width: 100vw; height: 100vh; }
        
        /* Sci-Fi Интерфейс */
        .hud-panel {
            position: absolute; z-index: 10; background: var(--bg);
            border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.1); backdrop-filter: blur(10px);
        }
        .hud-header {
            background: rgba(0, 229, 255, 0.15); padding: 10px; font-weight: bold;
            text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid var(--primary);
            color: var(--primary); font-size: 14px;
        }
        
        /* Панель управления */
        #command-center { top: 20px; right: 20px; width: 320px; display: flex; flex-direction: column; }
        .ship-selector { padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .ship-card {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid transparent;
            cursor: pointer; transition: all 0.3s;
        }
        .ship-card:hover { border-color: var(--primary); background: rgba(0, 229, 255, 0.1); }
        .ship-card input { display: none; }
        .ship-card.active { border-color: var(--primary); box-shadow: inset 0 0 10px rgba(0,229,255,0.2); }
        .ship-stats { font-size: 11px; color: #888; }
        .ship-name { font-size: 14px; font-weight: bold; }
        
        #launch-btn {
            background: linear-gradient(90deg, #ff3366, #ff6b33); border: none;
            padding: 15px; color: white; font-size: 16px; font-weight: bold; text-transform: uppercase;
            cursor: pointer; transition: 0.3s; margin: 15px; border-radius: 2px;
        }
        #launch-btn:hover { box-shadow: 0 0 20px rgba(255, 51, 102, 0.6); transform: scale(1.02); }
        #launch-btn:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; }

        /* Терминал телеметрии */
        #terminal { bottom: 20px; left: 20px; width: 350px; height: 200px; display: flex; flex-direction: column; }
        #log-content { padding: 10px; overflow-y: auto; flex-grow: 1; font-size: 12px; color: #0f0; display: flex; flex-direction: column; gap: 5px; }
        .log-entry { opacity: 0; animation: fadeIn 0.3s forwards; }
        .log-warn { color: #ffaa00; } .log-err { color: #ff3366; } .log-sys { color: #00e5ff; }
        
        /* Прицел */
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 30px; height: 30px; z-index: 5; pointer-events: none; opacity: 0.5;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,0.5); }
        #crosshair::before { top: 14px; left: 0; width: 30px; height: 2px; }
        #crosshair::after { top: 0; left: 14px; width: 2px; height: 30px; }

        @keyframes fadeIn { to { opacity: 1; } }
        
        /* Стили скроллбара */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.5); }
        ::-webkit-scrollbar-thumb { background: var(--primary); }
    </style>
    <!-- Подключение Three.js и GSAP (для кинематографичных анимаций) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>

    <!-- Правая панель: Управление -->
    <div id="command-center" class="hud-panel">
        <div class="hud-header">Конфигуратор флота</div>
        <div class="ship-selector">
            <div class="ship-card" onclick="toggleShip(this, 'light')">
                <div>
                    <div class="ship-name">"Стриж" - Разведчик</div>
                    <div class="ship-stats">Скорость: Высокая | Масса: 12т</div>
                </div>
                <input type="checkbox" id="ship-light" value="light">
            </div>
            <div class="ship-card" onclick="toggleShip(this, 'medium')">
                <div>
                    <div class="ship-name">"Мул" - Транспортник</div>
                    <div class="ship-stats">Скорость: Средняя | Масса: 45т</div>
                </div>
                <input type="checkbox" id="ship-medium" value="medium">
            </div>
            <div class="ship-card" onclick="toggleShip(this, 'heavy')">
                <div>
                    <div class="ship-name">"Титан" - Буровой мех</div>
                    <div class="ship-stats">Скорость: Низкая | Масса: 180т</div>
                </div>
                <input type="checkbox" id="ship-heavy" value="heavy">
            </div>
        </div>
        <button id="launch-btn">Инициализация запуска</button>
    </div>

    <!-- Левая панель: Телеметрия -->
    <div id="terminal" class="hud-panel">
        <div class="hud-header">Системный журнал</div>
        <div id="log-content"></div>
    </div>

    <div id="game-canvas"></div>

    <script>
        // --- 1. НАСТРОЙКА СЦЕНЫ И ДВИЖКА ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.005);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 15, 35);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Оптимизация
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('game-canvas').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enablePan = false;
        controls.minDistance = 15;
        controls.maxDistance = 60;
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- 2. ОСВЕЩЕНИЕ ---
        const ambientLight = new THREE.AmbientLight(0x111122, 1);
        scene.add(ambientLight);
        
        const sunLight = new THREE.DirectionalLight(0xfff0dd, 2);
        sunLight.position.set(50, 20, -30);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        // --- 3. ОКРУЖЕНИЕ (Космос и Планета) ---
        // Звезды
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 5000;
        const starsArray = new Float32Array(starsCount * 3);
        for(let i = 0; i < starsCount * 3; i++) {
            starsArray[i] = (Math.random() - 0.5) * 1000;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starsArray, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, transparent: true, opacity: 0.8 });
        const starField = new THREE.Points(starsGeo, starsMat);
        scene.add(starField);

        // Каллисто (Детализированная геометрия с шумом)
        const planetRadius = 10;
        const planetGeo = new THREE.IcosahedronGeometry(planetRadius, 16); // High poly
        // Делаем рельеф неровным
        const positions = planetGeo.attributes.position;
        for (let i = 0; i < positions.count; i++) {
            const v = new THREE.Vector3().fromBufferAttribute(positions, i);
            const noise = Math.sin(v.x * 2) * Math.cos(v.y * 2) * Math.sin(v.z * 2) * 0.3;
            v.add(v.clone().normalize().multiplyScalar(noise));
            positions.setXYZ(i, v.x, v.y, v.z);
        }
        planetGeo.computeVertexNormals();

        const planetMat = new THREE.MeshStandardMaterial({
            color: 0x4a4a4a, roughness: 0.9, metalness: 0.1, flatShading: true
        });
        const planet = new THREE.Mesh(planetGeo, planetMat);
        planet.receiveShadow = true;
        scene.add(planet);

        // Маркер зоны посадки
        const targetGeo = new THREE.TorusGeometry(0.5, 0.05, 16, 32);
        const targetMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.7 });
        const targetMarker = new THREE.Mesh(targetGeo, targetMat);
        targetMarker.rotation.x = Math.PI / 2;
        targetMarker.visible = false;
        scene.add(targetMarker);
        
        let targetPosition = null;
        let targetNormal = null;

        // --- 4. ФАБРИКА КОРАБЛЕЙ И ЧАСТИЦ ---
        const activeShips = [];
        const particles = [];

        // Движок частиц
        function createParticle(position, color) {
            const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 1 });
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.1), mat);
            mesh.position.copy(position);
            // Случайный разлет
            mesh.velocity = new THREE.Vector3( (Math.random()-0.5)*0.2, (Math.random()-0.5)*0.2, (Math.random()-0.5)*0.2 );
            mesh.life = 1.0; // Время жизни
            scene.add(mesh);
            particles.push(mesh);
        }

        function createShipMesh(type) {
            const group = new THREE.Group();
            let bodyMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.5 });
            let detailMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            let engineMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff });

            if (type === 'light') {
                const body = new THREE.Mesh(new THREE.ConeGeometry(0.3, 1.2, 3), bodyMat);
                body.rotation.x = Math.PI / 2;
                group.add(body);
                const engine = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.2, 0.2, 8), engineMat);
                engine.position.z = -0.6; engine.rotation.x = Math.PI / 2;
                group.add(engine);
            } 
            else if (type === 'medium') {
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.5, 1.5), bodyMat);
                group.add(body);
                const cargo = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.4, 0.8), detailMat);
                group.add(cargo);
                const engine1 = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.3), engineMat);
                engine1.position.set(0.2, 0, -0.8); engine1.rotation.x = Math.PI / 2;
                const engine2 = engine1.clone();
                engine2.position.set(-0.2, 0, -0.8);
                group.add(engine1, engine2);
            } 
            else if (type === 'heavy') {
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.8, 2, 8), bodyMat);
                body.rotation.x = Math.PI / 2;
                group.add(body);
                const drill = new THREE.Mesh(new THREE.ConeGeometry(0.4, 1, 8), detailMat);
                drill.position.z = 1.5; drill.rotation.x = Math.PI / 2;
                group.add(drill);
                const engine = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 0.4), engineMat);
                engine.position.z = -1;
                group.add(engine);
            }
            group.castShadow = true;
            return group;
        }

        // --- 5. ЛОГИКА ИГРЫ И UI ---
        function addLog(msg, type = 'sys') {
            const terminal = document.getElementById('log-content');
            const el = document.createElement('div');
            el.className = `log-entry log-${type}`;
            const time = new Date().toLocaleTimeString('en-US', {hour12: false});
            el.innerText = `[${time}] ${msg}`;
            terminal.appendChild(el);
            terminal.scrollTop = terminal.scrollHeight;
        }

        window.toggleShip = function(card, type) {
            const checkbox = document.getElementById('ship-' + type);
            checkbox.checked = !checkbox.checked;
            if(checkbox.checked) card.classList.add('active');
            else card.classList.remove('active');
            addLog(`Статус ангара: Аппарат [${type.toUpperCase()}] ${checkbox.checked ? 'готов к вылету' : 'отстранен'}.`);
        };

        // Raycasting (Выбор точки)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let gamePhase = 'planning'; // planning, cinematic, flying, landed

        window.addEventListener('click', (event) => {
            if (gamePhase !== 'planning') return;
            if (event.target.closest('.hud-panel')) return; // Клик по UI

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObject(planet);
            if (intersects.length > 0) {
                targetPosition = intersects[0].point;
                targetNormal = intersects[0].face.normal;
                
                targetMarker.position.copy(targetPosition);
                targetMarker.lookAt(targetPosition.clone().add(targetNormal));
                targetMarker.visible = true;
                
                addLog(`Координаты зафиксированы: X:${targetPosition.x.toFixed(1)} Y:${targetPosition.y.toFixed(1)} Z:${targetPosition.z.toFixed(1)}`, 'sys');
            }
        });

        // Запуск
        document.getElementById('launch-btn').addEventListener('click', () => {
            if (gamePhase !== 'planning') return;
            
            const selected = [];
            if(document.getElementById('ship-light').checked) selected.push({type: 'light', speed: 0.15, offset: -2});
            if(document.getElementById('ship-medium').checked) selected.push({type: 'medium', speed: 0.08, offset: 0});
            if(document.getElementById('ship-heavy').checked) selected.push({type: 'heavy', speed: 0.04, offset: 2});

            if (selected.length === 0) return addLog('ОШИБКА: Пустой флотилия. Выберите аппарат!', 'err');
            if (!targetPosition) return addLog('ОШИБКА: Цель не задана. Кликните по планете.', 'err');

            gamePhase = 'cinematic';
            addLog('ВНИМАНИЕ: Протокол запуска инициирован.', 'warn');
            document.getElementById('launch-btn').disabled = true;
            controls.enabled = false;

            // Создаем корабли на высокой орбите (напротив цели)
            const spawnDir = targetPosition.clone().normalize().multiplyScalar(30);
            
            selected.forEach((shipData) => {
                const mesh = createShipMesh(shipData.type);
                // Размещаем со смещением друг от друга
                const rightVector = new THREE.Vector3().crossVectors(targetNormal, new THREE.Vector3(0,1,0)).normalize();
                if(rightVector.lengthSq() < 0.1) rightVector.set(1,0,0);
                
                mesh.position.copy(spawnDir).add(rightVector.multiplyScalar(shipData.offset));
                mesh.lookAt(targetPosition);
                scene.add(mesh);
                
                activeShips.push({
                    mesh: mesh,
                    type: shipData.type,
                    speed: shipData.speed,
                    state: 'falling', // falling, braking, landed
                    targetPos: targetPosition.clone().add(rightVector.multiplyScalar(shipData.offset * 0.2)) // Слегка разводим на посадке
                });
            });

            // GSAP Кинематографичный пролет камеры
            gsap.to(camera.position, {
                x: spawnDir.x * 0.8, y: spawnDir.y * 0.8 + 10, z: spawnDir.z * 0.8 + 10,
                duration: 3, ease: "power2.inOut",
                onUpdate: () => camera.lookAt(targetPosition),
                onComplete: () => {
                    gamePhase = 'flying';
                    addLog('Вход в атмосферу. Двигатели на полную мощность.', 'warn');
                }
            });
        });

        // --- 6. ИГРОВОЙ ЦИКЛ (Update Loop) ---
        const clock = new THREE.Clock();

        function updatePhysics() {
            if (gamePhase === 'flying') {
                let allLanded = true;

                activeShips.forEach(ship => {
                    const dist = ship.mesh.position.distanceTo(ship.targetPos);
                    
                    if (dist > planetRadius * 0.1) {
                        allLanded = false;
                        
                        // Движение к цели
                        const dir = ship.targetPos.clone().sub(ship.mesh.position).normalize();
                        ship.mesh.position.add(dir.multiplyScalar(ship.speed));
                        
                        // Логика торможения (разворот двигателями вниз перед посадкой)
                        if (dist < 8 && ship.state === 'falling') {
                            ship.state = 'braking';
                            addLog(`[${ship.type}] Начало торможения.`, 'sys');
                        }

                        if (ship.state === 'braking') {
                            // Плавно поворачиваем кормой (двигателями) к планете
                            const up = ship.mesh.position.clone().normalize();
                            const targetRotation = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1), up);
                            ship.mesh.quaternion.slerp(targetRotation, 0.05);
                            
                            // Выброс частиц (Плазма из двигателей)
                            if(Math.random() > 0.3) {
                                const enginePos = ship.mesh.position.clone().add(dir.clone().multiplyScalar(-0.5));
                                createParticle(enginePos, 0x00e5ff); // Голубой огонь
                            }
                        } else {
                            // Падение носом вперед
                            ship.mesh.lookAt(ship.targetPos);
                        }
                    } else if (ship.state !== 'landed') {
                        ship.state = 'landed';
                        addLog(`[${ship.type}] Успешная посадка!`, 'sys');
                        // Облако пыли при касании
                        for(let i=0; i<20; i++) createParticle(ship.mesh.position, 0x888888);
                    }
                });

                if (allLanded) {
                    gamePhase = 'landed';
                    addLog('ОПЕРАЦИЯ ЗАВЕРШЕНА. Возврат управления камерой.', 'sys');
                    controls.enabled = true;
                    controls.target.copy(targetPosition);
                }
            }

            // Обновление частиц
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.position.add(p.velocity);
                p.material.opacity -= 0.02;
                p.scale.multiplyScalar(0.95);
                if (p.material.opacity <= 0) {
                    scene.remove(p);
                    p.material.dispose(); p.geometry.dispose();
                    particles.splice(i, 1);
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            // Вращение луны, если фаза планирования
            if (gamePhase === 'planning') {
                planet.rotation.y += 0.0005;
                if(targetMarker.visible) targetMarker.rotation.z += 0.05; // Вращение прицела
            }
            
            starField.rotation.y += 0.0002;
            controls.update();
            updatePhysics();
            
            renderer.render(scene, camera);
        }

        // Адаптивность
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Запуск
        addLog('Система онлайн. Инициализация орбитальных датчиков.', 'sys');
        animate();
    </script>
</body>
</html>
